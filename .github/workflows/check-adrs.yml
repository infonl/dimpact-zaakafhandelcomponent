name: Check ADRs

on:
  pull_request:
    paths:
      - "docs/adr/**"
      - "scripts/adr/**"
      - ".github/workflows/check-adrs.yml"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'main') }}

jobs:
  check-adrs:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check ADRs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: python3 scripts/adr/check-adrs.py ${BASE_SHA:+--base "$BASE_SHA"}
