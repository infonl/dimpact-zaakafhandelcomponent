name: Check SPDX License Headers

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

# Only allow a single concurrent run per branch. Cancel in-progress runs on multiple pushes when not on main branch.  
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'main')}}

jobs:
  check-spdx-license-headers:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check License Header
        uses: apache/skywalking-eyes/header@a196742f472feaffafea537ce5a2a4c3c53a8de4 # v0.9.0
        with:
          log: info
          config: .licenserc.yaml
          token: ${{ github.token }}
          mode: check
