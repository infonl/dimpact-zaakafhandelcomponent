name: Assign PR labels

on:
  pull_request:
    # also on later pushes, so a PR that grows beyond its first commit gets the labels of its new files
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  determine-pr-labels:
    runs-on: ubuntu-26.04
    steps:
      - name: Determine and set PR labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const extensionLabels = {
              '.java': 'java',
              '.kt': 'kotlin',
              '.kts': 'gradle',
              '.ts': 'typescript',
              '.js': 'javascript',
              '.mjs': 'javascript',
              '.cjs': 'javascript',
              '.html': 'html',
              '.less': 'less',
              '.py': 'python',
              '.sh': 'shell',
              '.sql': 'sql',
              '.rego': 'rego',
              '.bpmn': 'BPMN'
            };

            // dependency manifests and tool versions, wherever they are; Renovate's own PRs are labelled below
            const fileNameLabels = {
              'package.json': 'dependencies',
              'package-lock.json': 'dependencies',
              'libs.versions.toml': 'dependencies',
              'requirements.txt': 'dependencies',
              '.nvmrc': 'dependencies',
              '.python-version': 'dependencies'
            };
              
            const pathLabels = [
              { startsWith: 'docs/', label: 'documentation' },
              { startsWith: 'docs/solution-architecture/decisions/', label: 'adr' },
              { startsWith: 'openspec/', label: 'openspec' },
              { startsWith: 'src/main/resources/policies/', label: 'authorization' },
              { startsWith: '.github/workflows/', label: 'github_actions' },
              { startsWith: '.github/scripts/', label: 'github_actions' },
              { startsWith: 'gradle/wrapper/', label: 'gradle-wrapper' },
              { startsWith: 'charts/', label: 'helm' },
              { startsWith: 'src/e2e/', label: 'e2e' },
              { startsWith: 'src/main/resources/wildfly/', label: 'wildfly' },
              { startsWith: 'src/main/webapp/WEB-INF/', label: 'wildfly' },
              { startsWith: 'src/logFilter/module/', label: 'wildfly' },
              { startsWith: 'scripts/wildfly/', label: 'wildfly' },
              { startsWith: '.claude/', label: 'ai-instructions' },
              { startsWith: '.github/skills/', label: 'ai-instructions' },
              { startsWith: '.github/prompts/', label: 'ai-instructions' },
              { startsWith: '.github/copilot-instructions.md', label: 'ai-instructions' },
              { startsWith: 'AGENTS.md', label: 'ai-instructions' },
              { startsWith: 'CLAUDE.md', label: 'ai-instructions' }
            ];
              
            const labels = new Set();
            if (context.payload.pull_request.user.login === 'renovate[bot]') {
              labels.add('dependencies');
            }
              
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100
            });
              
            for (const f of files) {
              const filename = f.filename;
              // Extension-based labels
              for (const [ext, label] of Object.entries(extensionLabels)) {
                if (filename.endsWith(ext)) labels.add(label);
              }
              // File-name-based labels
              const fileNameLabel = fileNameLabels[filename.split('/').pop()];
              if (fileNameLabel) labels.add(fileNameLabel);
              // Path-based labels
              for (const { startsWith, label } of pathLabels) {
                if (filename.startsWith(startsWith)) labels.add(label);
              }
              // Special case for Dockerfile
              if (filename.includes('Dockerfile')) labels.add('docker');
            }
              
            const existingLabels = context.payload.pull_request.labels.map(l => l.name);
            const newLabels = Array.from(labels).filter(label => !existingLabels.includes(label));
            if (newLabels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: newLabels
              });
            }
