name: Playwright Tests
on:
  schedule:
    # Runs at 1:00 AM UTC from Monday to Friday
    - cron: "0 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  playwright:
    name: "Playwright Tests"
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    environment: azure-dimpact-dta
    steps:
      - name: Get current date
        id: date
        run: |
          date=$(date +'%Y-%m-%d-%H-%M')
          echo "date=$date" >> $GITHUB_OUTPUT
          # Branch reports go to a separate folder, so the main reports stay together.
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "report_path=$date" >> $GITHUB_OUTPUT
          else
            echo "report_path=branches/$date-run-id-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> $GITHUB_OUTPUT
          fi
      - name: login to azure and allow pssessions
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'
          enable-AzPSSession: true
      - name: check IP
        run: |
          my_ip=$(curl https://api.ipify.org)
          echo "my_ip=$my_ip" >> $GITHUB_ENV
      - name: add ip to nsg
        uses: azure/cli@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
        with:
          azcliversion: latest
          inlineScript: |
            az network nsg rule create -g zac-infra --nsg-name k8s-test-nsg -n allow_github_runner --priority 295 --source-address-prefixes ${{ env.my_ip }} --destination-port-ranges '*' --direction Inbound --access allow --protocol '*' --destination-address-prefixes '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: cd src/e2e && npm ci --ignore-scripts
      - name: Install Playwright Browsers
        timeout-minutes: 20
        run: cd src/e2e && npx playwright install --with-deps msedge
      - name: Run your tests
        run: 'cd src/e2e && npm run e2e:run -- --world-parameters "{\"urls\": { \"zac\": \"${{ secrets.ZAC_URL }}\", \"openForms\": \"${{ secrets.OPEN_FORMS_URL }}\" }, \"headless\": true, \"users\": { \"Bob\": { \"username\": \"${{ secrets.ZAC_E2E_TEST_USER_1_USERNAME }}\", \"password\": \"${{ secrets.ZAC_E2E_TEST_USER_1_PASSWORD }}\"}, \"Oscar\": { \"username\": \"${{ secrets.ZAC_E2E_TEST_USER_2_USERNAME }}\", \"password\": \"${{ secrets.ZAC_E2E_TEST_USER_2_PASSWORD }}\"}}}"'
      - name: Make a playwright report
        if: ${{ !cancelled() }}
        run: "cd src/e2e && npm run e2e:generate:report"
      - name: Extract metrics from Cucumber report
        id: metrics
        if: ${{ !cancelled() }}
        run: "cd src/e2e && npm run e2e:extract:metrics"
      - name: copy report to separate folder
        if: ${{ !cancelled() }}
        run: "cd src/e2e && mv reports ${{ steps.date.outputs.date }} && mkdir -p reports/$(dirname ${{ steps.date.outputs.report_path }}) && mv ${{ steps.date.outputs.date }} reports/${{ steps.date.outputs.report_path }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          path: src/e2e/reports
          retention-days: 7
      - name: Create .env file from secrets
        if: ${{ !cancelled() }}
        run: |
          echo "${{ secrets.E2E_ENV_FILE }}" > src/e2e/.env
      - name: BDD playwright
        run: cd src/e2e && npm run bdd:ci
        if: ${{ !cancelled() }}
        continue-on-error: true
      - name: Upload BDD test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bdd-test-artifacts
          path: |
            src/e2e/playwright-report
          retention-days: 7
      - name: Deploy to GitHub Pages
        if: ${{ !cancelled() }}
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./src/e2e/reports/ # directory of your reports
          publish_branch: gh-pages # deploying to gh-pages branch
          keep_files: true # retains files that are not part of the current publish
      - name: Notify Slack
        if: ${{ !cancelled() }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":performing_arts: Playwright Tests Update",
              "attachments": [
                {
                  "color": "${{ job.status == 'success' && 'good' || job.status == 'failure' && 'danger' || 'warning' }}",
                  "blocks": [
                    {
                      "type": "header",
                      "text": {
                        "type": "plain_text",
                        "text": "Workflow Run Details"
                      }
                    },
                    {
                      "type": "section",
                      "fields": [
                        {
                          "type": "mrkdwn",
                          "text": "*Repository:*\n${{ github.repository }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Workflow:*\n${{ github.workflow }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Job:*\n${{ github.job }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Status:*\n${{ job.status }} ${{ job.status == 'success' && ':white_check_mark:' || ':x:' }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Branch:*\n${{ github.ref_name }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Triggered by:*\n${{ github.event_name == 'schedule' && 'schedule' || github.triggering_actor }}"
                        }
                      ]
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*Report URL:*\n:link: https://infonl.github.io/dimpact-zaakafhandelcomponent/${{ steps.date.outputs.report_path }}/index.html"
                      }
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": ${{ steps.metrics.outputs.slack_summary || '"No e2e metrics available for this run."' }}
                      }
                    },
                    {
                      "type": "actions",
                      "elements": [
                        {
                          "type": "button",
                          "text": {
                            "type": "plain_text",
                            "text": "View Report"
                          },
                          "url": "https://infonl.github.io/dimpact-zaakafhandelcomponent/${{ steps.date.outputs.report_path }}/index.html"
                        },
                        {
                          "type": "button",
                          "text": {
                            "type": "plain_text",
                            "text": "View Run & Timings"
                          },
                          "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                        },
                        {
                          "type": "button",
                          "text": {
                            "type": "plain_text",
                            "text": "View Videos"
                          },
                          "url": "https://infonl.github.io/dimpact-zaakafhandelcomponent/${{ steps.date.outputs.report_path }}/videos.html"
                        }
                      ]
                    }
                  ]
                }
              ]
            }
      - name: remove nsg rule by name
        if: always()
        uses: azure/cli@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
        with:
          azcliversion: latest
          inlineScript: |
            az network nsg rule delete -g zac-infra --nsg-name k8s-test-nsg -n allow_github_runner
