name: Playwright Tests
on:
  schedule:
    # Runs at 1:00 AM UTC from Monday to Friday
    - cron: "0 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  playwright:
    name: "Playwright Tests"
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    environment: azure-dimpact-dta
    steps:
      - name: Get current date
        id: date
        run: |
          date=$(date +'%Y-%m-%d-%H-%M')
          echo "date=$date" >> $GITHUB_OUTPUT
          # Branch reports go to a separate folder, so the main reports stay together.
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "report_path=$date" >> $GITHUB_OUTPUT
          else
            echo "report_path=branches/$date-run-id-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> $GITHUB_OUTPUT
          fi
      - name: login to azure and allow pssessions
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'
          enable-AzPSSession: true
      - name: check IP
        run: |
          my_ip=$(curl https://api.ipify.org)
          echo "my_ip=$my_ip" >> $GITHUB_ENV
      - name: add ip to nsg
        uses: azure/cli@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
        with:
          azcliversion: latest
          inlineScript: |
            az network nsg rule create -g zac-infra --nsg-name k8s-test-nsg -n allow_github_runner --priority 295 --source-address-prefixes ${{ env.my_ip }} --destination-port-ranges '*' --direction Inbound --access allow --protocol '*' --destination-address-prefixes '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install the e2e dependencies and the browser
        timeout-minutes: 20
        run: |
          cd src/e2e
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Run the e2e tests
        env:
          E2E_TARGET: dev
          ZAC_URL: ${{ secrets.ZAC_URL }}
          OPEN_FORMS_URL: ${{ secrets.OPEN_FORMS_URL }}
          E2E_TEST_USER_1_USERNAME: ${{ secrets.ZAC_E2E_TEST_USER_1_USERNAME }}
          E2E_TEST_USER_1_PASSWORD: ${{ secrets.ZAC_E2E_TEST_USER_1_PASSWORD }}
          E2E_TEST_USER_2_USERNAME: ${{ secrets.ZAC_E2E_TEST_USER_2_USERNAME }}
          E2E_TEST_USER_2_PASSWORD: ${{ secrets.ZAC_E2E_TEST_USER_2_PASSWORD }}
        run: cd src/e2e && npm test
      - name: Summarize the results
        id: summary
        if: ${{ !cancelled() }}
        run: |
          cd src/e2e
          node reporting/summarize.ts reports/results.json "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"
      # GitHub Pages and the artifacts of this repository are public.
      - name: Check that the report holds no secrets
        id: report-check
        if: ${{ !cancelled() }}
        env:
          E2E_TEST_USER_1_PASSWORD: ${{ secrets.ZAC_E2E_TEST_USER_1_PASSWORD }}
          E2E_TEST_USER_2_PASSWORD: ${{ secrets.ZAC_E2E_TEST_USER_2_PASSWORD }}
        run: >-
          python3 -I scripts/github/check-e2e-report-for-secrets.py src/e2e/playwright-report
          E2E_TEST_USER_1_PASSWORD E2E_TEST_USER_2_PASSWORD
      - name: Copy the report to the folder of this run
        if: ${{ !cancelled() && steps.report-check.outcome == 'success' }}
        env:
          REPORT_PATH: ${{ steps.date.outputs.report_path }}
        run: |
          mkdir -p "site/$(dirname "$REPORT_PATH")"
          mv src/e2e/playwright-report "site/$REPORT_PATH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.report-check.outcome == 'success' }}
        with:
          path: site
          retention-days: 7
      - name: Deploy to GitHub Pages
        id: deploy
        if: ${{ !cancelled() && steps.report-check.outcome == 'success' }}
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages # deploying to gh-pages branch
          keep_files: true # retains files that are not part of the current publish
      - name: Notify Slack
        if: ${{ !cancelled() }}
        uses: slackapi/slack-github-action@0bc3581177d9a0f8d555e07689384b376528e8fa # v4.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":performing_arts: Playwright Tests Update",
              "attachments": [
                {
                  "color": "${{ job.status == 'success' && 'good' || job.status == 'failure' && 'danger' || 'warning' }}",
                  "blocks": [
                    {
                      "type": "header",
                      "text": {
                        "type": "plain_text",
                        "text": "Workflow Run Details"
                      }
                    },
                    {
                      "type": "section",
                      "fields": [
                        {
                          "type": "mrkdwn",
                          "text": "*Repository:*\n${{ github.repository }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Workflow:*\n${{ github.workflow }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Job:*\n${{ github.job }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Status:*\n${{ job.status }} ${{ job.status == 'success' && ':white_check_mark:' || ':x:' }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Branch:*\n${{ github.ref_name }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Triggered by:*\n${{ github.event_name == 'schedule' && 'schedule' || github.triggering_actor }}"
                        }
                      ]
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*Report URL:*\n${{ steps.deploy.outcome == 'success' && format(':link: https://infonl.github.io/dimpact-zaakafhandelcomponent/{0}/index.html', steps.date.outputs.report_path) || 'This run published no report.' }}"
                      }
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": ${{ steps.summary.outputs.slack_summary || '"The run stopped before it had results."' }}
                      }
                    },
                    {
                      "type": "actions",
                      "elements": [
                        {
                          "type": "button",
                          "text": {
                            "type": "plain_text",
                            "text": "View Report"
                          },
                          "url": "${{ steps.deploy.outcome == 'success' && format('https://infonl.github.io/dimpact-zaakafhandelcomponent/{0}/index.html', steps.date.outputs.report_path) || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}"
                        },
                        {
                          "type": "button",
                          "text": {
                            "type": "plain_text",
                            "text": "View Run & Timings"
                          },
                          "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                        }
                      ]
                    }
                  ]
                }
              ]
            }
      - name: remove nsg rule by name
        if: always()
        uses: azure/cli@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
        with:
          azcliversion: latest
          inlineScript: |
            az network nsg rule delete -g zac-infra --nsg-name k8s-test-nsg -n allow_github_runner
