name: Clean up old ZAC Docker Images
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # every night at midnight, utc

permissions:
  packages: write

# the cleanup action is not safe to run in parallel against the same package
concurrency:
  group: clean-up-docker-images
  cancel-in-progress: false

jobs:
  # Tags point to multi-platform image indexes whose child manifests (platform images and
  # provenance/SBOM attestations) are stored as untagged package versions. Deleting untagged versions
  # blindly breaks tagged images ("manifest unknown" on pull). The ghcr-cleanup-action resolves the
  # manifest tree, so it only deletes untagged versions that no remaining tagged image references.
  clean-up:
    runs-on: ubuntu-26.04
    name: Delete old Docker images, keep release versions
    steps:
      # Keeps the 10 most recent tagged images, while always preserving:
      #   - 'latest'
      #   - minor version tags              (e.g. 2.2 or v2.2)
      #   - all patch version tags          (e.g. 4.7.0, 4.6.1 or v4.6.1)
      #   - version tags with a suffix      (e.g. 4.7.0-dev, but NOT 4.7.0-dev.123)
      # This means build artifacts like main-12345 are eligible for cleanup.
      # An image is preserved if any of its tags matches, so e.g. 'main-12345' is kept when it
      # shares a digest with a release tag.
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          owner: infonl
          package: zaakafhandelcomponent
          keep-n-tagged: 10
          # In regex mode the whole value is ONE regex (it is not split on commas), and a pattern with
          # nested quantifiers is rejected as ReDoS-prone, hence the flat alternation.
          exclude-tags: '^(latest|v?[0-9]+\.[0-9]+|v?[0-9]+\.[0-9]+\.[0-9]+|v?[0-9]+\.[0-9]+\.[0-9]+-[^.]+)$'
          use-regex: true
          delete-untagged: true
          delete-partial-images: true
          delete-ghost-images: true
          delete-orphaned-images: true
          validate: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # The NVD database cache image is republished daily under the ':latest' tag,
      # which orphans the previous digest. Clean up those untagged versions too.
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          owner: infonl
          package: nvd-database-cache
          delete-untagged: true
          token: ${{ secrets.GITHUB_TOKEN }}
