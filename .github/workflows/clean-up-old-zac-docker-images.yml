name: Clean up old ZAC Docker Images
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # every night at midnight, utc

permissions:
  packages: write

# the cleanup action is not safe to run in parallel against the same package
concurrency:
  group: clean-up-docker-images
  cancel-in-progress: false

jobs:
  # Remove untagged (orphaned) container image versions.
  #
  # Note: tags point to multi-platform image indexes whose child manifests (platform images,
  # provenance/SBOM attestations) are stored as untagged package versions. Deleting all untagged
  # versions blindly breaks tagged images ("manifest unknown" on pull). The ghcr-cleanup-action
  # resolves the manifest tree and only deletes untagged versions that no tagged image references.
  clean-untagged:
    runs-on: ubuntu-26.04
    name: Delete untagged Docker images
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          owner: infonl
          package: zaakafhandelcomponent
          delete-untagged: true
          delete-partial-images: true
          delete-ghost-images: true
          delete-orphaned-images: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # The NVD database cache image is republished daily under the ':latest' tag,
      # which orphans the previous digest. Clean up those untagged versions too.
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          owner: infonl
          package: nvd-database-cache
          delete-untagged: true
          token: ${{ secrets.GITHUB_TOKEN }}

  # Delete old tagged images but keep the 10 most recent, while always preserving:
  #   - 'latest'
  #   - minor version tags              (e.g. 2.2 or v2.2)
  #   - all patch version tags          (e.g. 4.7.0, 4.6.1 or v4.6.1)
  #   - version tags with a suffix      (e.g. 4.7.0-dev, but NOT 4.7.0-dev.123)
  # This means build artifacts like main-12345 are eligible for cleanup.
  #
  # Note: we use a custom script instead of the actions/delete-package-versions
  # action's ignore-versions parameter because for container packages the action
  # matches the regex against the SHA256 digest (version name), not against the
  # image tags, so tag-based patterns never match.
  clean-tagged:
    needs: clean-untagged
    runs-on: ubuntu-26.04
    name: Delete old Docker images, keep minor release versions
    steps:
      - name: Delete old tagged Docker images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="infonl"
          package="zaakafhandelcomponent"
          keep=10
          preserve='^(latest|v?\d+\.\d+(\.\d+(-[^.\s]+)?)?)$'

          echo "Fetching all versions of ${owner}/${package}..."
          versions=$(gh api --paginate \
            "/orgs/${owner}/packages/container/${package}/versions" \
            | jq -s 'add // []')

          total=$(jq 'length' <<< "$versions")
          echo "Total versions: ${total}"

          if (( total == 0 )); then
            echo "No versions found. Nothing to do."
            exit 0
          fi

          preserved=$(jq -r --arg pat "$preserve" '
            [ .[]
              | select(.metadata.container.tags | length > 0)
              | select(.metadata.container.tags | any(test($pat)))
            ] | length
          ' <<< "$versions")
          echo "Preserved versions (tag matches pattern): ${preserved}"

          to_delete=$(jq -r --arg pat "$preserve" --argjson keep "$keep" '
            [ .[]
              | select(.metadata.container.tags | length > 0)
              | select(.metadata.container.tags | all(test($pat) | not))
            ]
            | sort_by(.created_at) | reverse
            | .[$keep:]
            | .[].id
          ' <<< "$versions")

          count=$(grep -c '[0-9]' <<< "$to_delete" || true)
          echo "Deletable versions beyond newest ${keep}: ${count}"

          deleted=0
          while IFS= read -r id; do
            [ -z "$id" ] && continue
            if (( deleted >= 100 )); then
              echo "Rate limit: stopping after 100 deletions per run"
              break
            fi
            echo "Deleting version ${id}..."
            gh api --method DELETE \
              "/orgs/${owner}/packages/container/${package}/versions/${id}" \
              --silent 2>/dev/null || echo "  Warning: failed to delete ${id}"
            deleted=$((deleted + 1))
          done <<< "$to_delete"

          echo "Done. Deleted ${deleted} versions."

  # Temporary dry run to compare with 'clean-tagged' above. Check the logged deletions against that job's
  # output; if they match, replace 'clean-tagged' with this job and drop 'dry-run'.
  clean-tagged-dry-run:
    needs: [clean-untagged, clean-tagged]
    runs-on: ubuntu-26.04
    name: Dry run - delete old Docker images with ghcr-cleanup-action
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          owner: infonl
          package: zaakafhandelcomponent
          keep-n-tagged: 10
          # comma-separated regexes; a single pattern with nested groups is rejected as ReDoS-prone
          exclude-tags: '^latest$,^v?[0-9]+\.[0-9]+$,^v?[0-9]+\.[0-9]+\.[0-9]+$,^v?[0-9]+\.[0-9]+\.[0-9]+-[^.]+$'
          use-regex: true
          delete-untagged: true
          delete-partial-images: true
          delete-ghost-images: true
          delete-orphaned-images: true
          validate: true
          dry-run: true
          token: ${{ secrets.GITHUB_TOKEN }}
