name: Build, test & deploy

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Select the version bump for a sprint release.'
        type: choice
        required: true
        default: 'minor'
        options:
          - minor
          - major
      hotfix_version:
        description: 'Explicit version for hotfix branch (e.g. 1.4.7). Required when dispatching on a hotfix/* branch.'
        type: string
        required: false
  push:
    branches:
      - main
    paths-ignore:
      # ignore pushes to the publiccode.yaml file or else we would trigger an endless build loop
      - 'publiccode.yaml'

env:
  JAVA_VERSION: "25.0.4"
  CONTAINER_REGISTRY_URL: "ghcr.io/infonl"
  APPLICATION_NAME: "zaakafhandelcomponent"

permissions:
  contents: write
  packages: write
  checks: write
  pull-requests: write
  # Required for uploading SARIF reports
  security-events: write

# Only allow a single concurrent run per branch. Cancel any runs that are in progress when not on the main branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate-input:
    runs-on: ubuntu-26.04
    outputs:
      version-bump: ${{ github.event.inputs.confirm || 'minor' }}
    steps:
      - name: Use selected version bump
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          echo "Version will be bumped to next ${{ github.event.inputs.confirm || 'minor' }} number."

      - name: Manual version bump only allowed on main branch
        if: ${{ github.ref != 'refs/heads/main' && github.event_name == 'workflow_dispatch' && (!startsWith(github.ref_name, 'hotfix/') || github.event.inputs.hotfix_version == '') }}
        run: |
          echo "Version bump input only valid on main (hotfix branches require explicit hotfix_version)."
          exit 1

  determine-version:
    runs-on: ubuntu-26.04
    needs: [validate-input]
    outputs:
      version: ${{ steps.set-hotfix-version.outputs.version || steps.calc-version.outputs.version }}
      tag: ${{ steps.set-hotfix-version.outputs.tag || steps.calc-version.outputs.tag }}
      release-type: ${{ steps.release-type.outputs.release-type }}
      previous-tag: ${{ steps.prev-tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Ensure hotfix_version input provided
        if: startsWith(github.ref_name, 'hotfix/')
        run: |
          if [ -z "${{ github.event.inputs.hotfix_version }}" ]; then
            echo "hotfix_version input is required when running on a hotfix/* branch."
            exit 1
          fi

      - name: Validate semantic version pattern
        if: startsWith(github.ref_name, 'hotfix/')
        run: |
          V='${{ github.event.inputs.hotfix_version }}'
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._-]+)?$'; then
            echo "hotfix_version '$V' is not a valid semantic version (expected: N.N.N or N.N.N-suffix)."
            exit 1
          fi

      - name: Check hotfix tag does not already exist
        if: startsWith(github.ref_name, 'hotfix/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V='${{ github.event.inputs.hotfix_version }}'
          if git ls-remote --exit-code --tags origin "refs/tags/v${V}" >/dev/null 2>&1; then
            echo "Tag v${V} already exists. Choose a different version."
            exit 1
          fi

      - name: Set hotfix version outputs
        if: startsWith(github.ref_name, 'hotfix/')
        id: set-hotfix-version
        run: |
          echo "version=${{ github.event.inputs.hotfix_version }}" >> "$GITHUB_OUTPUT"
          echo "tag=v${{ github.event.inputs.hotfix_version }}" >> "$GITHUB_OUTPUT"
          echo "Calculated version: ${{ github.event.inputs.hotfix_version }} (tag: v${{ github.event.inputs.hotfix_version }})"

      - name: Determine release type
        id: release-type
        run: |
          if [[ "${{ startsWith(github.ref_name, 'hotfix/') }}" == "true" ]]; then
            echo "release-type=hotfix" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "release-type=release" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "release-type=dev" >> "$GITHUB_OUTPUT"
          else
            echo "release-type=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Calculate next version
        if: ${{ !startsWith(github.ref_name, 'hotfix/') }}
        id: calc-version
        run: |
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -m 1 -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          if [ -z "$LATEST_TAG" ]; then
            echo "No previous release tag found. Starting from v0.0.0"
            LATEST_TAG="v0.0.0"
          fi
          echo "Highest release tag: $LATEST_TAG"

          VERSION="${LATEST_TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)

          RELEASE_TYPE="${{ steps.release-type.outputs.release-type }}"

          if [ "$RELEASE_TYPE" = "dev" ]; then
            # Dev builds always assume next minor version
            MINOR=$((MINOR + 1))
            NEXT_VERSION="${MAJOR}.${MINOR}.0-dev"
          else
            BUMP_TYPE="${{ needs.validate-input.outputs.version-bump }}"
            case "$BUMP_TYPE" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                ;;
            esac
            NEXT_VERSION="${MAJOR}.${MINOR}.0"
          fi

          echo "version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Calculated version: ${NEXT_VERSION} (release type: ${RELEASE_TYPE})"

      - name: Find previous release tag
        id: prev-tag
        run: |
          PREV_TAG=$(git tag -l 'v*' --sort=-v:refname --merged HEAD | grep -m 1 -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          echo "tag=${PREV_TAG:-}" >> "$GITHUB_OUTPUT"
          echo "Previous release tag: ${PREV_TAG:-none}"

  paths-filter:
    runs-on: ubuntu-26.04
    needs: validate-input
    outputs:
      changes-requiring-build: ${{ steps.paths-filter.outputs.changes-requiring-build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Skip job when only certain files or file types are changed which do not require a pull request build
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: paths-filter
        with:
          # the field below incorrectly results in a schema validation. see: https://github.com/dorny/paths-filter/issues/225
          predicate-quantifier: 'every'
          # Please keep this list in sync with the one in the 'codeql.yml' workflow
          filters: |
            changes-requiring-build:
              - '**'
              - '!*.sh'
              - '!.github/CODEOWNERS'
              - '!**/*.md'
              - '!**/*.pdf'
              - '!**/*.png'
              - '!charts/**'
              - '!docs/**'
              - '!src/e2e/**'
              - '!openspec/**'
              - '!renovate.json'

  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs: [paths-filter, validate-input]
    if: ${{ needs.paths-filter.outputs.changes-requiring-build == 'true' || github.ref == 'refs/heads/main' || startsWith(github.ref_name, 'hotfix/') }}
    outputs:
      branch_name: ${{ steps.gen_branch_name.outputs.BRANCH_NAME }}
      build_number: ${{ steps.gen_build_number.outputs.BUILD_NUMBER }}
      zac_docker_image: ${{ steps.gen_tag.outputs.ZAC_DOCKER_IMAGE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set branch name
        id: gen_branch_name
        run: echo "BRANCH_NAME=${{ github.ref_name }}" | sed 's/\//_/g; s/(//g; s/)//g' >> $GITHUB_OUTPUT

      - name: Set build number
        id: gen_build_number
        run: echo "BUILD_NUMBER=${{ steps.gen_branch_name.outputs.BRANCH_NAME }}-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Set Docker image tag
        id: gen_tag
        run: echo "ZAC_DOCKER_IMAGE=${{ env.CONTAINER_REGISTRY_URL }}/${{ env.APPLICATION_NAME }}:${{ steps.gen_build_number.outputs.BUILD_NUMBER }}" >> $GITHUB_OUTPUT

      - name: Setup JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          # Use the Maven cache here so that Maven artefacts (Maven build is triggered from the Gradle build) are cached.
          cache: 'maven'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # The Gradle configuration cache lives in the project's '.gradle' directory, which this action
          # only caches when it can encrypt it. Without the secret it behaves as it did before.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The Gradle build also executes a Maven command to build the WildFly bootable JAR.
      # The frontend linter is excluded because every job below waits for this one while it runs, and
      # nothing below needs its result. The 'frontend-unit-tests' job runs it instead.
      # 'copyJacocoAgentForItest' is built here so that the integration test shards can start the ZAC
      # container without waiting for Gradle.
      - name: Gradle build
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ./gradlew clean build copyJacocoAgentForItest -x test -x npmRunLint --info
          else
            ./gradlew build copyJacocoAgentForItest -x test -x npmRunLint --info
          fi

      - name: Upload Gradle build artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gradle-build
          path: |
            build
          retention-days: 1

      - name: Upload generated Java clients
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-java-clients
          path: |
            src/generated
          retention-days: 1

      # Only the generated types are shared with the frontend jobs. They install their own dependencies,
      # which keeps compressing and uploading 'node_modules' - a minute of work spread over three jobs -
      # off the critical path of every job that waits for this one.
      - name: Upload generated frontend types
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-frontend-types
          path: src/main/app/src/generated/types
          retention-days: 1

      # The integration test shards start the ZAC container before they run Gradle, and it only starts
      # when the JaCoCo agent it records the integration test coverage with is in place.
      - name: Upload JaCoCo agent
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-agent
          path: build/jacoco/itest/jacoco-agent
          retention-days: 1

      - name: Upload built ZAC JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zac-jar
          path: |
            target/zaakafhandelcomponent.jar
          retention-days: 1

  backend-unit-tests:
    needs: [build, paths-filter]
    if: ${{ (github.event_name != 'merge_group' && needs.paths-filter.outputs.changes-requiring-build == 'true') || github.ref == 'refs/heads/main' || startsWith(github.ref_name, 'hotfix/') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      READ_PACKAGES_USERNAME: $${{ vars.READ_PACKAGES_USERNAME }}
      READ_PACKAGES_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # needed for the OPA image used by the policy tests below
      - name: Authenticate with Docker Hub to avoid rate limiting issues
        # Skip for pull requests from forks because a forked repository is not allowed to access our secrets
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # The Gradle configuration cache lives in the project's '.gradle' directory, which this action
          # only caches when it can encrypt it. Without the secret it behaves as it did before.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Download Gradle build artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gradle-build
          path: build

      - name: Download generated Java clients
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-java-clients
          path: src/generated

      - name: Run backend unit tests and generate the test coverage report
        run: |
          ./gradlew \
          -x processResources \
          -x classes \
          -x generateJavaClients \
          -x generateJsonSchema2Pojo \
          -x generateOpenApiSpec \
          -x npmInstall \
          test jacocoTestReport --info

      # The OPA policy tests are unit tests of the authorisation policies, so they run here and not in the integration test stack.
      - name: Run OPA policy tests
        if: ${{ !cancelled() }}
        run: docker compose --profile opa-tests run --rm --no-deps opa-tests

      # The test results of both unit test jobs are published together by the 'run-unit-tests' job
      - name: Upload backend unit test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-unit-test-results
          path: build/test-results/test/**/*.xml
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload backend unit test results to CodeCov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: "test_results"

      - name: Upload backend unit test coverage report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: backendunittests
          directory: ./build/reports/jacoco/test

  # Jest is split over two shards; both run the Angular test builder, so this job needs neither a JDK
  # nor Gradle. It also runs the frontend linter, which the 'build' job leaves to this job because it
  # has the slack for it and nothing waits for its result.
  frontend-unit-tests:
    needs: [build, paths-filter]
    if: ${{ (github.event_name != 'merge_group' && needs.paths-filter.outputs.changes-requiring-build == 'true') || github.ref == 'refs/heads/main' || startsWith(github.ref_name, 'hotfix/') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      # let the other shard finish so that all failures show up in one run
      fail-fast: false
      matrix:
        # every shard uploads its own coverage report, so update 'after_n_builds' in codecov.yml
        # when the number of shards changes
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/main/app/package-lock.json

      - name: Download generated frontend types
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-frontend-types
          path: src/main/app/src/generated/types

      - name: Install frontend dependencies
        working-directory: src/main/app
        run: npm ci

      - name: Run the frontend linter
        if: ${{ matrix.shard == 1 }}
        working-directory: src/main/app
        run: npm run lint

      - name: Restore Jest transform cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/main/app/.jest-cache
          key: jest-transform-${{ runner.os }}-shard-${{ matrix.shard }}-${{ hashFiles('src/main/app/package-lock.json', 'src/main/app/jest.config.js', 'src/main/app/tsconfig.json', 'src/main/app/tsconfig.spec.json') }}-${{ github.run_id }}
          restore-keys: |
            jest-transform-${{ runner.os }}-shard-${{ matrix.shard }}-${{ hashFiles('src/main/app/package-lock.json', 'src/main/app/jest.config.js', 'src/main/app/tsconfig.json', 'src/main/app/tsconfig.spec.json') }}-
            jest-transform-${{ runner.os }}-shard-${{ matrix.shard }}-

      - name: Run frontend unit tests and generate the test coverage report
        working-directory: src/main/app
        run: npm run test:report -- --shard=${{ matrix.shard }}/2

      # The test results of both unit test jobs are published together by the 'run-unit-tests' job
      - name: Upload frontend unit test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-unit-test-results-shard-${{ matrix.shard }}
          path: src/main/app/reports/*.xml
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload frontend unit test results to CodeCov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: "test_results"

      # Codecov merges the partial coverage reports of the shards into one report per commit
      - name: Upload frontend unit test coverage report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: frontendunittests
          directory: ./src/main/app/coverage

  # Combines the results of the backend and frontend unit tests into the single 'unit-test-results' check.
  # This job is a required status check on the main branch, so keep its name.
  run-unit-tests:
    needs: [backend-unit-tests, frontend-unit-tests]
    if: ${{ !cancelled() && needs.backend-unit-tests.result != 'skipped' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Download backend unit test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: backend-unit-test-results
          path: build/test-results/test
          merge-multiple: true

      - name: Download frontend unit test results of all shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: frontend-unit-test-results-shard-*
          path: src/main/app/reports
          merge-multiple: false

      - name: Publish unit test results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          check_name: unit-test-results
          files: |
            build/test-results/test/**/*.xml
            src/main/app/reports/**/*.xml

      - name: Fail when a unit test job failed
        if: ${{ needs.backend-unit-tests.result != 'success' || needs.frontend-unit-tests.result != 'success' }}
        run: |
          echo "The backend unit tests finished with result '${{ needs.backend-unit-tests.result }}'"
          echo "The frontend unit tests finished with result '${{ needs.frontend-unit-tests.result }}'"
          exit 1

  # Every shard builds the ZAC Docker image, starts its own Docker Compose stack and runs the specs
  # that 'src/itest/itest-shards.txt' assigns to it. The 'build-docker-image-and-run-itests' job below
  # combines the results of all shards.
  itest-shard:
    needs: [build, paths-filter, determine-version]
    if: ${{ (github.event_name != 'merge_group' && needs.paths-filter.outputs.changes-requiring-build == 'true') || github.ref == 'refs/heads/main' || startsWith(github.ref_name, 'hotfix/') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      # let the other shards finish so that all failures show up in one run
      fail-fast: false
      matrix:
        # every shard uploads its own coverage report, so update 'after_n_builds' in codecov.yml
        # when the number of shards changes
        shard: [1, 2, 3]
    env:
      BUILD_NUMBER: ${{ needs.build.outputs.build_number }}
      BRANCH_NAME: ${{ needs.build.outputs.branch_name }}
      ZAC_DOCKER_IMAGE: ${{ needs.build.outputs.zac_docker_image }}
      GIT_COMMIT_HASH: ${{ github.sha }}
      BAG_API_CLIENT_MP_REST_URL: ${{ vars.BAG_API_CLIENT_MP_REST_URL }}
      BAG_API_KEY: ${{ secrets.BAG_API_KEY }}
      NEXT_VERSION: ${{ needs.determine-version.outputs.version }}
      # The stack is started by the step below instead of by the integration tests, so that it boots
      # while the ZAC Docker image is built and Gradle starts up. Both have to agree on the Compose
      # project name for the integration tests to find the containers of the stack.
      COMPOSE_PROJECT_NAME: zac-itest
      DO_NOT_START_DOCKER_COMPOSE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate with Docker Hub to avoid rate limiting issues
        # Skip for pull requests from forks because a forked repository is not allowed to access our secrets
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pull the images and boot the stack in the background while the JDK, Gradle and the ZAC Docker
      # image are being prepared. The script starts ZAC as soon as its image and the JaCoCo agent are
      # there, so that by the time Gradle reaches the integration tests the stack is up.
      - name: Start the Docker Compose stack in the background
        run: |
          nohup ./scripts/docker/start-itest-docker-compose-stack.sh \
            < /dev/null > "$RUNNER_TEMP/compose-up.log" 2>&1 &

      - name: Setup JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # The Gradle configuration cache lives in the project's '.gradle' directory, which this action
          # only caches when it can encrypt it. Without the secret it behaves as it did before.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Download built ZAC JAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zac-jar
          path: target

      - name: Download JaCoCo agent
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jacoco-agent
          path: build/jacoco/itest/jacoco-agent

      # No layer cache: the JAR layer changes with every commit, so a cache would hardly ever hit.
      - name: Build Docker image
        run: |
          docker build \
            --tag "${ZAC_DOCKER_IMAGE}" \
            --build-arg versionNumber="${NEXT_VERSION}" \
            --build-arg branchName="${BRANCH_NAME}" \
            --build-arg commitHash="${GIT_COMMIT_HASH}" \
            .

      # The full integration test log (including the container logs) is written to a file that is uploaded
      # as an artifact when the tests fail. The console only shows failed tests.
      - name: Run integration tests
        run: |
          ./gradlew -PzacDockerImage=${ZAC_DOCKER_IMAGE} -PitestShard=${{ matrix.shard }} \
            -PitestLogFile=build/reports/itest/itest.log \
            -x compileJava -x processResources -x compileKotlin -x classes -x buildDockerImage \
            itest

      - name: Show how the Docker Compose stack was started
        if: ${{ failure() }}
        run: cat "$RUNNER_TEMP/compose-up.log"

      - name: Publish integration test timings
        if: ${{ !cancelled() }}
        run: |
          if [ -f build/reports/itest/timings.md ]; then
            tee --append "$GITHUB_STEP_SUMMARY" < build/reports/itest/timings.md
          else
            echo "No integration test timing report was generated" | tee --append "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload integration test log
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-log-shard-${{ matrix.shard }}
          path: build/reports/itest/itest.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload integration test results to CodeCov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: "test_results"

      # The test results of all shards are published together by the 'build-docker-image-and-run-itests' job
      - name: Upload integration test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-results-shard-${{ matrix.shard }}
          path: build/test-results/itest/**/*.xml
          if-no-files-found: ignore
          retention-days: 1

      # JaCoCo requires our Java class files to be able to generate a report
      # so download the Gradle build artefacts uploaded by the build job
      - name: Download Gradle build artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gradle-build
          path: build

      - name: Generate JaCoCo integration test code coverage report
        if: ${{ !cancelled() }}
        run: ./gradlew jacocoIntegrationTestReport -x itest --info

      # Codecov merges the partial coverage reports of the shards into one report per commit
      - name: Upload integration test coverage report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ !cancelled() }}
        with:
          flags: integrationtests
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # Push the tested image under its build number tag straight from the first shard. The 'push-docker-image' job
      # then only adds the release tags in the registry, so the image never has to be saved, uploaded and loaded again.
      # The release tags are only added when all shards have passed.
      - name: Docker Login
        if: ${{ matrix.shard == 1 && (github.ref == 'refs/heads/main' || startsWith(github.ref_name, 'hotfix/')) }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image with build number tag
        if: ${{ matrix.shard == 1 && (github.ref == 'refs/heads/main' || startsWith(github.ref_name, 'hotfix/')) }}
        run: docker push ${ZAC_DOCKER_IMAGE}

  # Combines the results of the integration test shards into the single 'integration-test-results' check.
  # This job is a required status check on the main branch, so keep its name.
  build-docker-image-and-run-itests:
    needs: [itest-shard]
    if: ${{ !cancelled() && needs.itest-shard.result != 'skipped' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Download integration test results of all shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: integration-test-results-shard-*
          path: build/test-results/itest
          merge-multiple: true

      - name: Publish integration test results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          check_name: integration-test-results
          files: |
            build/test-results/itest/**/*.xml

      - name: Fail when an integration test shard failed
        if: ${{ needs.itest-shard.result != 'success' }}
        run: |
          echo "The integration test shards finished with result '${{ needs.itest-shard.result }}'"
          exit 1

  # Tagging the image, creating the release and triggering the provisioning are seconds of work each.
  # They run in one job because three jobs would pay for three runner allocations and three checkouts.
  push-docker-image:
    needs: [build, run-unit-tests, build-docker-image-and-run-itests, determine-version]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # Avoid infinite build loop on renovate updates
    if: ${{ (github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'update ghcr.io/infonl/zaakafhandelcomponent docker tag') && !contains(github.event.head_commit.message, 'update dependency infonl/dimpact-zaakafhandelcomponent to')) || startsWith(github.ref_name, 'hotfix/') }}
    env:
      ZAC_DOCKER_IMAGE: ${{ needs.build.outputs.zac_docker_image }}
      NEXT_VERSION: ${{ needs.determine-version.outputs.version }}
      NEXT_VERSION_TAG: ${{ needs.determine-version.outputs.tag }}
      RELEASE_TYPE: ${{ needs.determine-version.outputs.release-type }}
      PREVIOUS_TAG: ${{ needs.determine-version.outputs.previous-tag }}
      PROVISION_TAG: ${{ needs.determine-version.outputs.release-type == 'dev' && format('{0}.{1}', needs.determine-version.outputs.version, github.run_number) || needs.determine-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker Login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image was already pushed under its build number tag by the integration test job.
      # 'docker buildx imagetools create' adds the other tags in the registry without pulling the image.
      - name: Tag Docker Image with 'latest' tag
        if: github.ref == 'refs/heads/main'
        run: docker buildx imagetools create --tag ${CONTAINER_REGISTRY_URL}/${APPLICATION_NAME}:latest ${ZAC_DOCKER_IMAGE}

      - name: Tag Docker Image with version tag
        if: env.NEXT_VERSION != ''
        run: docker buildx imagetools create --tag ${CONTAINER_REGISTRY_URL}/${APPLICATION_NAME}:${NEXT_VERSION} ${ZAC_DOCKER_IMAGE}

      - name: Tag Docker Image with pinned dev build number tag
        if: ${{ env.RELEASE_TYPE == 'dev' }}
        run: docker buildx imagetools create --tag ${CONTAINER_REGISTRY_URL}/${APPLICATION_NAME}:${NEXT_VERSION}.${{ github.run_number }} ${ZAC_DOCKER_IMAGE}

      - name: Tag Docker Image with major and minor version tags
        if: ${{ env.NEXT_VERSION != '' && env.RELEASE_TYPE == 'release' }}
        run: |
          MAJOR_VERSION=$(echo ${NEXT_VERSION} | cut -d '.' -f 1)
          MINOR_VERSION=$(echo ${NEXT_VERSION} | cut -d '.' -f 2)
          docker buildx imagetools create \
            --tag ${CONTAINER_REGISTRY_URL}/${APPLICATION_NAME}:${MAJOR_VERSION} \
            --tag ${CONTAINER_REGISTRY_URL}/${APPLICATION_NAME}:${MAJOR_VERSION}.${MINOR_VERSION} \
            ${ZAC_DOCKER_IMAGE}

      - name: Delete existing dev pre-releases
        if: ${{ env.RELEASE_TYPE == 'dev' || env.RELEASE_TYPE == 'release' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dev_tags=$(gh release list --json tagName,isPrerelease -q '[.[] | select(.isPrerelease and (.tagName | endswith("-dev")))] | .[].tagName' 2>/dev/null || echo "")
          for tag in $dev_tags; do
            echo "Deleting dev pre-release: $tag"
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          done

      - name: Read dependencies
        id: dependencies
        run: |
          echo "dependencies<<EOF" >> $GITHUB_OUTPUT
          cat DEPENDENCIES.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release-notes
        if: ${{ env.PREVIOUS_TAG != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="${{ env.NEXT_VERSION_TAG }}" \
            -f target_commitish="${{ github.sha }}" \
            -f previous_tag_name="${{ env.PREVIOUS_TAG }}" \
            --jq '.body' >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create dev pre-release
        if: ${{ env.RELEASE_TYPE == 'dev' }}
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ env.NEXT_VERSION_TAG }}
          commit: ${{ github.sha }}
          name: ${{ env.APPLICATION_NAME }} ${{ env.NEXT_VERSION }} (development build)
          body: |
            ⚠️ **This is a development pre-release and is updated with every push to main.**

            Docker image: `${{ env.CONTAINER_REGISTRY_URL }}/${{ env.APPLICATION_NAME }}:${{ env.NEXT_VERSION }}`
            Build: #${{ github.run_number }} | Commit: `${{ github.sha }}`

            ## Tested Against

            ${{ steps.dependencies.outputs.dependencies }}

            ${{ steps.release-notes.outputs.notes }}
          draft: false
          prerelease: true
          makeLatest: false
          allowUpdates: true
          updateOnlyUnreleased: true

      - name: Create release
        if: ${{ env.RELEASE_TYPE == 'release' || env.RELEASE_TYPE == 'hotfix' }}
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ env.NEXT_VERSION_TAG }}
          commit: ${{ github.sha }}
          name: ${{ env.APPLICATION_NAME }} ${{ env.NEXT_VERSION }}
          body: |
            This release contains the docker image ${{ env.APPLICATION_NAME }} ${{ env.NEXT_VERSION }}, which is available
            at ${{ env.CONTAINER_REGISTRY_URL }}/${{ env.APPLICATION_NAME }}:${{ env.NEXT_VERSION }}

            ## Tested Against

            ${{ steps.dependencies.outputs.dependencies }}

            ${{ steps.release-notes.outputs.notes }}
          draft: false
          prerelease: false
          allowUpdates: true
          makeLatest: ${{ env.RELEASE_TYPE == 'release' }}

      - name: Trigger the provisioning of the new version
        if: ${{ github.ref == 'refs/heads/main' && vars.ENABLE_AUTOMATIC_PROVISION == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.PROVISION_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'infonl',
              repo: 'dimpact-provisioning',
              workflow_id: 'azure-provision-zaakafhandelcomponent.yml',
              inputs: {
                tag: '${{ env.PROVISION_TAG }}',
                commit_sha: '${{ github.sha }}',
              },
              ref: 'main'
            })
