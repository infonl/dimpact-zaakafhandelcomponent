#
# Checks every week that all Git tags and GitHub releases match the retention policy of ADR 0011, and deletes the
# ones that do not when started by hand.
name: Clean up tags and releases

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday at 06:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run lists what would be deleted; apply deletes it"
        type: choice
        options: [dry-run, apply]
        default: dry-run
      include-charts:
        description: "Also delete the zaakafhandelcomponent-* chart releases. Only after 'Helm chart release' ran with migrate-chart-packages."
        type: boolean
        default: false

concurrency:
  group: clean-up-tags-and-releases
  cancel-in-progress: false

jobs:
  check:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check tags and releases against the retention policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/github/cleanup-tags-and-releases.py --check

  clean-up:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    # A job stops after 6 hours; the script stops earlier, and a new run continues where it stopped.
    timeout-minutes: 340
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dry run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INCLUDE_CHARTS: ${{ inputs.include-charts && '--include-charts' || '' }}
        run: python3 scripts/github/cleanup-tags-and-releases.py ${INCLUDE_CHARTS}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tags-and-releases-dry-run
          path: |
            keep.txt
            delete.txt
      - name: Delete
        if: ${{ inputs.mode == 'apply' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INCLUDE_CHARTS: ${{ inputs.include-charts && '--include-charts' || '' }}
        run: python3 scripts/github/cleanup-tags-and-releases.py --apply --max-minutes 320 ${INCLUDE_CHARTS}
