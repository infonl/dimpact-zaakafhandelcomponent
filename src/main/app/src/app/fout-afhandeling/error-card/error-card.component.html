<mat-card>
  <mat-card-content>
    <mat-icon color="primary" outlined>{{ displayedIconName() }}</mat-icon>
    <h2>{{ displayedTitle() || "error-card.title.default" | translate }}</h2>
    @if (displayedText(); as text) {
      <p>{{ text | translate }}</p>
    }
  </mat-card-content>
</mat-card>
