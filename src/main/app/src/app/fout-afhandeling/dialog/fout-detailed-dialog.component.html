<mat-toolbar role="heading" class="gap-16" mat-dialog-title>
  <mat-icon>error</mat-icon>
  <span class="flex-grow-1">
    {{ "dialoog.error.titel.algemeen" | translate }}
  </span>
  <button mat-icon-button (click)="close()">
    <mat-icon>close</mat-icon>
  </button>
</mat-toolbar>
<mat-divider></mat-divider>

<div mat-dialog-content>
  @if (data.error) {
    <p>{{ data.error }}</p>
  }
  @if (data.details) {
    <p style="white-space: pre-line">{{ data.details }}</p>
  }
  @if (data.showServerErrorTexts) {
    @for (serverErrorText of serverErrorTexts | async; track serverErrorText) {
      <p>
        {{ serverErrorText }}
      </p>
    }
  }
</div>

<div mat-dialog-actions>
  <button autofocus mat-raised-button (click)="close()">
    {{ "actie.sluiten" | translate }}
  </button>
</div>
