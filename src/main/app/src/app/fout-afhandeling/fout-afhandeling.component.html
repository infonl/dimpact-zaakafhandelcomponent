<mat-card>
  <mat-card-content>
    <mat-icon color="primary" outlined>error</mat-icon>
    <h2>{{ foutmelding || "error-card.title.default" | translate }}</h2>
    @if (bericht) {
      <p>{{ bericht }}</p>
    }
    @for (
      serverErrorText of serverErrorTextsQuery.data() ?? [];
      track serverErrorText
    ) {
      <p>
        {{ serverErrorText }}
      </p>
    }
  </mat-card-content>
</mat-card>
