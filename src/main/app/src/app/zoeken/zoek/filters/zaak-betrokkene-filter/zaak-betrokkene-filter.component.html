<mat-card>
  <mat-card-title>{{
    "zoeken.filter.zaak-betrokkene" | translate
  }}</mat-card-title>
  <mat-card-content class="zaak-betrokkene-filter">
    <mat-form-field class="full-width" appearance="fill">
      <mat-select
        id="betrokkeneRoltype_filter"
        [aria-label]="'zoeken.filter.zaak-betrokkene' | translate"
        [value]="roltype()"
        (selectionChange)="roltypeChanged($event.value)"
      >
        @for (roltype of roltypen; track roltype.zoekVeld) {
          <mat-option [value]="roltype.zoekVeld">{{
            roltype.label | translate
          }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <mat-form-field class="full-width" appearance="fill">
      <input
        matInput
        placeholder="{{ 'bsn.vestigingsnummer.rsin' | translate }}"
        #idInput
        [value]="klantId()"
        (input)="klantId.set(idInput.value)"
        (blur)="idChanged()"
        (keyup.enter)="idChanged()"
      />
      <mat-icon
        [ngClass]="{ active: dialogOpen() }"
        matSuffix
        (click)="openDialog()"
        >person</mat-icon
      >
    </mat-form-field>
  </mat-card-content>
</mat-card>
