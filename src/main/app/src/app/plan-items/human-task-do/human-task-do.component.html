<mat-toolbar role="heading" class="gap-16">
  <mat-icon>assignment</mat-icon>
  <span class="flex-grow-1">
    {{ "title.taak.starten" | translate: { taak: planItem()?.naam || "" } }}
  </span>
  <button mat-icon-button (click)="sideNav().close()">
    <mat-icon>close</mat-icon>
  </button>
</mat-toolbar>
<mat-divider></mat-divider>

@if (formFields.length) {
  <section class="mt-2">
    <zac-composed-form
      [form]="form"
      [fields]="formFields"
      [config]="formConfig"
      [loading]="doHumanTaskPlanItemMutation.isPending()"
      [success]="doHumanTaskPlanItemMutation.isSuccess()"
      disableAfterSuccess
      (formSubmitted)="onFormSubmit($event)"
      (formCancelled)="onFormCancel()"
    />
  </section>
} @else {
  <section class="flex-fill flex-row justify-center items-center">
    <mat-spinner diameter="30" />
  </section>
}
