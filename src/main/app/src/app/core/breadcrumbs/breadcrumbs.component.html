@if (breadcrumbs().length) {
  <nav [attr.aria-label]="'breadcrumbs' | translate">
    <ol>
      @for (breadcrumb of breadcrumbs(); track $index) {
        @if ($last) {
          <li aria-current="page">{{ breadcrumb.title }}</li>
        } @else {
          <li>
            <a [routerLink]="breadcrumb.url">{{ breadcrumb.title }}</a>
          </li>
        }
      }
    </ol>
  </nav>
}
