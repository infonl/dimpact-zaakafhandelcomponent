@if (titles().length) {
  <nav [attr.aria-label]="'breadcrumbs' | translate">
    <ol>
      @for (title of titles(); track $index) {
        <li [attr.aria-current]="$last ? 'page' : null">{{ title }}</li>
      }
    </ol>
  </nav>
}
