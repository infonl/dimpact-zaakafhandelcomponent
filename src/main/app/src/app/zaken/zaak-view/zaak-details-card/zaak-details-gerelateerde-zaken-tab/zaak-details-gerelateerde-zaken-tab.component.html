<div class="table-wrapper">
  <table mat-table [dataSource]="gerelateerdeZaken()">
    <ng-container
      *ngFor="let column of gerelateerdeZaakColumns"
      [matColumnDef]="column"
    >
      <th mat-header-cell *matHeaderCellDef>
        {{ "gerelateerde.zaak." + column | translate }}
      </th>
      <td mat-cell *matCellDef="let row">
        {{ row[column] | empty | datum }}
      </td>
    </ng-container>
    <ng-container matColumnDef="actions" stickyEnd>
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        <a
          *ngIf="row.rechten.lezen"
          mat-icon-button
          [routerLink]="['/zaken', row.identificatie]"
          (click)="$event.stopPropagation()"
          [id]="'zaakBekijken_' + row.identificatie + '_button'"
          title="{{ 'actie.zaak.bekijken' | translate }}"
        >
          <mat-icon>visibility</mat-icon>
        </a>
        @if (row.ontkoppelen) {
          <button
            mat-icon-button
            (click)="zaakOntkoppelen.emit(row)"
            [id]="'zaakOntkoppelen_' + row.identificatie + '_button'"
            title="{{ 'actie.zaak.ontkoppelen' | translate }}"
          >
            <mat-icon>link_off</mat-icon>
          </button>
        }
      </td>
    </ng-container>
    <tr
      mat-header-row
      *matHeaderRowDef="gerelateerdeZaakColumnsWithAction"
    ></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: gerelateerdeZaakColumnsWithAction"
    ></tr>
  </table>
</div>
