<mat-toolbar role="heading" class="gap-16" mat-dialog-title>
  <mat-icon>link_off</mat-icon>
  <span class="flex-grow-1">
    {{ "title.zaak.ontkoppelen" | translate }}
  </span>
  <button
    mat-icon-button
    title="{{ 'actie.sluiten' | translate }}"
    (click)="dialogRef.close()"
  >
    <mat-icon>close</mat-icon>
  </button>
</mat-toolbar>
<mat-divider></mat-divider>

<form [formGroup]="form" (submit)="ontkoppel()">
  <mat-dialog-content>
    <zac-textarea [form]="form" key="reden"></zac-textarea>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button
      [disabled]="
        form.invalid ||
        ontkoppelZaakMutation.isPending() ||
        ontkoppelZaakMutation.isSuccess()
      "
      mat-raised-button
      color="primary"
      type="submit"
    >
      <mat-icon *ngIf="ontkoppelZaakMutation.isPending()">
        <mat-spinner diameter="18"></mat-spinner>
      </mat-icon>
      {{ "actie.ontkoppelen" | translate }}
    </button>
    <button
      [disabled]="ontkoppelZaakMutation.isPending()"
      mat-raised-button
      (click)="dialogRef.close()"
      type="button"
    >
      {{ "actie.annuleren" | translate }}
    </button>
  </mat-dialog-actions>
</form>
