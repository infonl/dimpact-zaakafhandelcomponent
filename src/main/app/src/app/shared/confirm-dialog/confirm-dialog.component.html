<mat-toolbar role="heading" class="gap-16" mat-dialog-title>
  @if (data.opties.icon) {
    <mat-icon>{{ data.opties.icon }}</mat-icon>
  }
  <span class="flex-grow-1">
    @if (data.opties.titel; as titel) {
      {{ titel.key | translate: titel.args }}
    } @else {
      {{ "actie.bevestig" | translate }}
    }
  </span>
  <button mat-icon-button (click)="cancel()">
    <mat-icon>close</mat-icon>
  </button>
</mat-toolbar>
<mat-divider></mat-divider>

<div mat-dialog-content>
  <p [innerHTML]="data._melding.key | translate: data._melding.args"></p>
  @if (data.uitleg) {
    <p class="uitleg" [innerHTML]="data.uitleg"></p>
  }
</div>

<div mat-dialog-actions>
  <button
    id="confirmButton"
    mat-raised-button
    color="primary"
    [disabled]="loading()"
    (click)="confirm()"
  >
    @if (loading()) {
      <mat-icon>
        <mat-spinner diameter="18"></mat-spinner>
      </mat-icon>
    }
    {{ data.opties.bevestigLabel ?? "actie.ja" | translate }}
  </button>
  <button
    id="cancelButton"
    mat-raised-button
    [disabled]="loading()"
    (click)="cancel()"
  >
    {{ data.opties.annuleerLabel ?? "actie.nee" | translate }}
  </button>
</div>
