<mat-form-field subscriptSizing="dynamic" floatLabel="always">
  @if (showLabel()) {
    <mat-label>
      <ng-content select="mat-label">
        {{ label() | translate | capitalizeFirstLetter }}
      </ng-content>
    </mat-label>
  }
  <mat-date-range-input [rangePicker]="datumPicker" (change)="change()">
    <input
      matStartDate
      [placeholder]="'zoeken.filter.van' | translate"
      [formControl]="dateVan"
    />
    <input
      matEndDate
      [placeholder]="'zoeken.filter.tot-en-met' | translate"
      [formControl]="dateTM"
    />
  </mat-date-range-input>
  @if (!hasRange()) {
    <mat-datepicker-toggle
      matSuffix
      [for]="datumPicker"
    ></mat-datepicker-toggle>
  }
  @if (hasRange()) {
    <mat-icon matSuffix (click)="clearDate($event)">clear</mat-icon>
  }
  <mat-date-range-picker
    (closed)="change()"
    disabled="false"
    #datumPicker
  ></mat-date-range-picker>
</mat-form-field>
