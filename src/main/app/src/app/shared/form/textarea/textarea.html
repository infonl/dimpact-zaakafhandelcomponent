<mat-form-field [formGroup]="form()" class="full-width" appearance="fill">
  <mat-label>
    <ng-content select="mat-label">
      {{ labelKey() | translate | capitalizeFirstLetter }}
    </ng-content>
  </mat-label>
  <textarea
    matInput
    autocomplete="off"
    cdkTextareaAutosize
    [cdkAutosizeMinRows]="minRows()"
    [cdkAutosizeMaxRows]="maxRows()"
    [formControlName]="key()"
    [maxLength]="maxlength() ?? 999999"
    [readonly]="readonly()"
  ></textarea>
  @if (!readonly() && !control()?.disabled && control()?.value?.length) {
    <button
      matSuffix
      mat-icon-button
      type="button"
      (click)="control()?.reset(null)"
    >
      <mat-icon>clear</mat-icon>
    </button>
  }
  <span matSuffix>
    <ng-content select="button"></ng-content>
    <ng-content select="mat-icon"></ng-content>
  </span>
  @if (formError()) {
    <mat-error>{{ formError() }}</mat-error>
  }
  <mat-hint>
    <ng-content select="mat-hint"></ng-content>
  </mat-hint>
  @if (maxlength()) {
    <mat-hint align="end">
      {{ control()?.value?.length ?? 0 }} / {{ maxlength() }}
    </mat-hint>
  }
</mat-form-field>
