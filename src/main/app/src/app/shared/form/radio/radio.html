<section [formGroup]="form()" class="flex-col gap-5">
  <mat-label style="font-weight: bold" class="mb-2">
    <ng-content select="mat-label">
      {{ labelKey() | translate | capitalizeFirstLetter }}
      {{ isRequired() ? "*" : "" }}
    </ng-content>
  </mat-label>
  <mat-radio-group [formControlName]="key()" class="flex flex-col gap-5">
    @for (option of availableOptions(); track option) {
      <mat-radio-button
        [required]="isRequired()"
        [checked]="compareWith(option, control()?.value)"
        [value]="option"
      >
        {{ displayWith(option) | translate }}
      </mat-radio-button>
    }
  </mat-radio-group>
  @if (formError()) {
    <mat-error>{{ formError() }}</mat-error>
  }
  <mat-hint>
    <ng-content select="mat-hint"></ng-content>
  </mat-hint>
</section>
