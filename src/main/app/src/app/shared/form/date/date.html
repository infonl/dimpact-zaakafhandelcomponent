<mat-form-field [formGroup]="form()" class="full-width" appearance="fill">
  <mat-label>
    <ng-content select="mat-label">
      {{ labelKey() | translate | capitalizeFirstLetter }}
    </ng-content>
  </mat-label>
  <input
    type="date"
    matInput
    autocomplete="off"
    [min]="min()"
    [max]="max()"
    [formControlName]="key()"
    [matDatepicker]="date"
  />
  @if (showAmountOfDays()) {
    <span matSuffix>{{ control()?.value | dagen }}</span>
  }
  @if (!control()?.disabled && control()?.value) {
    <button
      matSuffix
      mat-icon-button
      type="button"
      (click)="control()?.reset(null)"
    >
      <mat-icon>clear</mat-icon>
    </button>
  }
  @if (!control()?.value) {
    <mat-datepicker-toggle matSuffix [for]="date"></mat-datepicker-toggle>
  }
  <mat-datepicker #date></mat-datepicker>
  @if (formError()) {
    <mat-error>{{ formError() }}</mat-error>
  }
  <mat-hint>
    <ng-content select="mat-hint"></ng-content>
  </mat-hint>
</mat-form-field>
