<div [formGroup]="form()" class="full-width">
  <mat-slide-toggle
    class="flex"
    [formControlName]="key()"
    color="primary"
    [required]="isRequired()"
    [labelPosition]="labelPosition()"
  >
    <mat-label>
      <ng-content select="mat-label">
        {{ labelKey() | translate | capitalizeFirstLetter }}
      </ng-content>
    </mat-label>
  </mat-slide-toggle>
  @if (formError()) {
    <mat-error>{{ formError() }}</mat-error>
  }
  <mat-hint>
    <ng-content select="mat-hint"></ng-content>
  </mat-hint>
</div>
