<header>
  <h2>{{ zaaktypeOmschrijving() }}</h2>
  <p>
    {{ "zaps.step.proces-model-methode.intro" | translate }}
  </p>
</header>

<section>
  <zac-radio
    [form]="form()"
    key="options"
    label="zaps.step.proces-model-methode.label"
    [options]="options"
    optionDisplayValue="label"
  ></zac-radio>

  <div class="flex-row items-center gap-10 ml-1 my-3">
    <mat-icon color="warn" class="pr-3">warning</mat-icon>
    <small>{{ "msg.zaakafhandelparameters.waarschuwing" | translate }}</small>
  </div>
</section>
