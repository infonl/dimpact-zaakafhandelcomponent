<mat-card>
  <mat-card-content>
    <form [formGroup]="form()" class="flex-col">
      <div class="table-wrapper form-table">
        <table mat-table [dataSource]="rows()">
          <ng-container matColumnDef="select">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let row">
              @if (row.redenForm) {
                <zac-checkbox
                  [form]="row.redenForm"
                  key="selected"
                  label="actief"
                ></zac-checkbox>
              } @else {
                <zac-checkbox
                  [form]="zaakNietOntvankelijkSelectedForm"
                  key="selected"
                  label="actief"
                  readonly
                ></zac-checkbox>
              }
            </td>
          </ng-container>
          <ng-container matColumnDef="reden">
            <th mat-header-cell *matHeaderCellDef translate="reden"></th>
            <td mat-cell *matCellDef="let row">
              {{ row.naam ?? "zaak-is-niet-ontvankelijk" | translate }}
            </td>
          </ng-container>
          <ng-container matColumnDef="resultaat">
            <th mat-header-cell *matHeaderCellDef translate="resultaat"></th>
            <td mat-cell *matCellDef="let row">
              @if (row.redenForm) {
                <zac-select
                  [form]="row.redenForm"
                  key="resultaattype"
                  label="resultaat"
                  [options]="resultaattypesQuery.data() ?? []"
                  optionDisplayValue="naam"
                  [compare]="compareObject"
                ></zac-select>
              } @else {
                <zac-select
                  [form]="form()"
                  key="zaakNietOntvankelijkResultaattype"
                  label="resultaat"
                  [options]="resultaattypesQuery.data() ?? []"
                  optionDisplayValue="naam"
                  [compare]="compareObject"
                ></zac-select>
              }
            </td>
          </ng-container>
          <tr
            mat-header-row
            *matHeaderRowDef="['select', 'reden', 'resultaat']"
          ></tr>
          <tr
            mat-row
            *matRowDef="let row; columns: ['select', 'reden', 'resultaat']"
          ></tr>
        </table>
      </div>
    </form>
  </mat-card-content>
</mat-card>
