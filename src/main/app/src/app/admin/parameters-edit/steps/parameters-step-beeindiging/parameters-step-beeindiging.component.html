<mat-card>
  <mat-card-content>
    <form [formGroup]="form()" class="flex-col">
      <div class="table-wrapper">
        <table mat-table [dataSource]="rows()">
          <ng-container matColumnDef="select">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let row">
              @if (row.selected) {
                <mat-checkbox [formControl]="row.selected"></mat-checkbox>
              } @else {
                <mat-checkbox [checked]="true" [disabled]="true"></mat-checkbox>
              }
            </td>
          </ng-container>
          <ng-container matColumnDef="reden">
            <th mat-header-cell *matHeaderCellDef translate="reden"></th>
            <td mat-cell *matCellDef="let row">
              {{ row.naam ?? "zaak-is-niet-ontvankelijk" | translate }}
            </td>
          </ng-container>
          <ng-container matColumnDef="resultaat">
            <th mat-header-cell *matHeaderCellDef translate="resultaat"></th>
            <td mat-cell *matCellDef="let row">
              <mat-select
                placeholder="{{ 'resultaat.kies' | translate }}"
                [formControl]="row.resultaattype"
                [compareWith]="compareObject"
              >
                @for (
                  resultaattype of resultaattypesQuery.data() ?? [];
                  track resultaattype
                ) {
                  <mat-option [value]="resultaattype">{{
                    resultaattype.naam
                  }}</mat-option>
                }
              </mat-select>
            </td>
          </ng-container>
          <tr
            mat-header-row
            *matHeaderRowDef="['select', 'reden', 'resultaat']"
          ></tr>
          <tr
            mat-row
            *matRowDef="let row; columns: ['select', 'reden', 'resultaat']"
          ></tr>
        </table>
      </div>
    </form>
  </mat-card-content>
</mat-card>
