@if (algemeenFormGroup) {
  <mat-stepper
    orientation="horizontal"
    [linear]="!algemeenFormGroup.valid"
    [selectedIndex]="selectedIndexStart()"
  >
    <!--
    Step below is skipped on load when parameters are already saved
  -->
    <mat-step [stepControl]="cmmnBpmnFormGroup">
      <ng-template matStepLabel>{{
        "gegevens.proces-model-methode.bpmn" | translate
      }}</ng-template>

      <zac-parameters-step-proces-model
        [form]="cmmnBpmnFormGroup"
        [zaaktypeOmschrijving]="
          bpmnZaakafhandelParameters.zaaktype.omschrijving
        "
      />

      <div class="button-group flex-row flex-wrap">
        <button mat-raised-button matStepperNext>
          {{ "actie.volgende" | translate }}
        </button>
        <button
          mat-raised-button
          color="primary"
          [disabled]="
            !isValid() ||
            createOrUpdateBpmnZaakafhandelparametersMutation.isPending()
          "
          (click)="opslaan()"
        >
          {{ "actie.opslaan" | translate }}
        </button>
      </div>
    </mat-step>

    <mat-step [stepControl]="algemeenFormGroup">
      <ng-template matStepLabel>{{
        "gegevens.algemeen" | translate
      }}</ng-template>

      <zac-parameters-step-algemeen
        [form]="algemeenFormGroup.controls.algemeen"
        [zaaktype]="bpmnZaakafhandelParameters.zaaktype"
        [isZaakspecifiekAutoriseerbaar]="
          bpmnZaakafhandelParameters.isZaakspecifiekAutoriseerbaar
        "
        [showWarningWindows]="false"
      >
        <zac-select
          class="col-12 col-lg-6"
          key="bpmnDefinition"
          label="bpmn.process-definition"
          optionDisplayValue="name"
          [form]="algemeenFormGroup"
          [options]="bpmnProcessDefinitions"
        >
        </zac-select>
      </zac-parameters-step-algemeen>
      <div class="button-group flex-row flex-wrap">
        <button mat-raised-button matStepperPrevious>
          {{ "actie.terug" | translate }}
        </button>
        <button mat-raised-button matStepperNext>
          {{ "actie.volgende" | translate }}
        </button>
        <button
          mat-raised-button
          color="primary"
          (click)="opslaan()"
          [disabled]="
            !isValid() ||
            createOrUpdateBpmnZaakafhandelparametersMutation.isPending()
          "
        >
          {{ "actie.opslaan" | translate }}
        </button>
      </div>
    </mat-step>
    <mat-step
      [stepControl]="zaakbeeindigFormGroup"
      [hasError]="zaakbeeindigFormGroup.invalid"
    >
      <ng-template matStepLabel>{{
        "gegevens.beeindiging" | translate
      }}</ng-template>
      <ng-template matStepContent>
        <zac-parameters-step-beeindiging
          [form]="zaakbeeindigFormGroup"
          [zaaktypeUuid]="bpmnZaakafhandelParameters.zaaktype.uuid"
        />
        <div class="button-group flex-row flex-wrap">
          <button mat-raised-button matStepperPrevious>
            {{ "actie.terug" | translate }}
          </button>
          <button mat-raised-button matStepperNext>
            {{ "actie.volgende" | translate }}
          </button>
          <button
            mat-raised-button
            color="primary"
            [disabled]="
              !isValid() ||
              createOrUpdateBpmnZaakafhandelparametersMutation.isPending()
            "
            (click)="opslaan()"
          >
            {{ "actie.opslaan" | translate }}
          </button>
        </div>
      </ng-template>
    </mat-step>
    <mat-step
      [stepControl]="koppelingenForm"
      [hasError]="koppelingenForm.invalid"
    >
      <ng-template matStepLabel>{{
        "gegevens.koppelingen" | translate
      }}</ng-template>
      <ng-template matStepContent>
        <zac-parameters-step-koppelingen
          [form]="koppelingenForm"
          [brpDoelbindingSetupEnabled]="brpDoelbindingSetupEnabled"
        />
        <smart-documents-form
          [zaakTypeUuid]="bpmnZaakafhandelParameters.zaaktype.uuid"
          [enabledGlobally]="
            bpmnZaakafhandelParameters.smartDocuments?.isEnabledGlobally ??
            false
          "
          [enabledForZaaktype]="
            bpmnZaakafhandelParameters.smartDocuments?.isEnabledForZaaktype ??
            false
          "
          #smartDocumentsFormRef
        ></smart-documents-form>
        <div class="button-group flex-row flex-wrap">
          <button mat-raised-button matStepperPrevious>
            {{ "actie.terug" | translate }}
          </button>
          <button
            mat-raised-button
            color="primary"
            [disabled]="
              !isValid() ||
              createOrUpdateBpmnZaakafhandelparametersMutation.isPending()
            "
            (click)="opslaan()"
          >
            {{ "actie.opslaan" | translate }}
          </button>
        </div>
      </ng-template>
    </mat-step>
  </mat-stepper>
}
