<mat-stepper orientation="horizontal" [linear]="true">
  <mat-step>
    <ng-template matStepLabel>{{
      "gegevens.proces-model-methode" | translate
    }}</ng-template>

    <zac-parameters-step-proces-model
      [form]="cmmnBpmnFormGroup"
      [zaaktypeOmschrijving]="caseParameters.zaaktype.omschrijving"
    />

    <div class="button-group flex-row flex-wrap">
      <button mat-raised-button matStepperNext>
        {{ "actie.volgende" | translate }}
      </button>
      <button mat-raised-button color="primary" disabled>
        {{ "actie.opslaan" | translate }}
      </button>
    </div>
  </mat-step>
</mat-stepper>
