<mat-sidenav-container
  class="inner-sidenav-container"
  #sideNavContainer
  [class]="sideNaveMode"
>
  <mat-sidenav
    #menuSidenav
    [mode]="sideNaveMode"
    position="start"
    opened="true"
    disableClose="true"
  >
    <zac-side-nav (mode)="menuModeChanged($event)" [menu]="menu"></zac-side-nav>
  </mat-sidenav>
  <mat-sidenav-content class="flex-col gap-20">
    @if (isLoading) {
      <div class="flex-fill flex-row justify-center items-center">
        <mat-spinner diameter="24"></mat-spinner>
      </div>
    } @else {
      @switch (modellingMethodSelection.type) {
        @default {
          <zac-parameters-select-process-model-method
            (switchModellingMethod)="switchModellingMethod($event)"
          >
          </zac-parameters-select-process-model-method>
        }

        @case ("CMMN") {
          <zac-parameters-edit-cmmn
            [selectedIndexStart]="
              modellingMethodSelection.selectedIndexStart ?? 0
            "
            (switchModellingMethod)="switchModellingMethod($event)"
          >
          </zac-parameters-edit-cmmn>
        }

        @case ("BPMN") {
          <zac-parameters-edit-bpmn
            [selectedIndexStart]="
              modellingMethodSelection.selectedIndexStart ?? 0
            "
            (switchModellingMethod)="switchModellingMethod($event)"
          >
            >
          </zac-parameters-edit-bpmn>
        }
      }
    }
  </mat-sidenav-content>
</mat-sidenav-container>
