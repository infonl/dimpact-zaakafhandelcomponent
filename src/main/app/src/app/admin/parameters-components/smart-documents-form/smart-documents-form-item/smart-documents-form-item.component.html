<fieldset>
  <mat-checkbox
    [formControl]="checkbox"
    [checked]="node().informatieObjectTypeUUID !== ''"
    (change)="clearSelectedDocumentType()"
  ></mat-checkbox>
  <div class="flex-1">{{ node().name }}</div>
  <mat-form-field subscriptSizing="dynamic">
    <mat-label>{{
      "informatieobject-type-omschrijving" | translate
    }}</mat-label>
    <mat-select
      [value]="node().informatieObjectTypeUUID"
      (valueChange)="selectDocumentType($event)"
      placeholder="{{ 'informatieobject-type.kies' | translate }}"
    >
      <mat-option [value]="">{{
        "informatieobject-type.geen" | translate
      }}</mat-option>
      <mat-option
        *ngFor="let informationObjectType of informationObjectTypes()"
        [value]="informationObjectType.uuid"
        >{{ informationObjectType.omschrijving }}</mat-option
      >
    </mat-select>
  </mat-form-field>
  <mat-form-field subscriptSizing="dynamic">
    <mat-label>{{ "vertrouwelijkheidaanduiding" | translate }}</mat-label>
    <input
      matInput
      [formControl]="confidentiality"
      translate="{{
        'vertrouwelijkheidaanduiding.' + confidentiality.getRawValue() | i18nKey
      }}"
    />
  </mat-form-field>
</fieldset>
