<mat-sidenav-container class="main-container" autosize>
  <mat-sidenav #zoekenSideNav position="end" mode="over">
    @defer (on idle) {
      <zac-zoeken [zoekenSideNav]="zoekenSideNav"></zac-zoeken>
    } @placeholder {
      <div class="side-nav-container">
        <mat-progress-bar mode="query"></mat-progress-bar>
      </div>
    }
  </mat-sidenav>
  <mat-sidenav-content>
    <zac-toolbar [zoekenSideNav]="zoekenSideNav"></zac-toolbar>
    <zac-loading></zac-loading>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
