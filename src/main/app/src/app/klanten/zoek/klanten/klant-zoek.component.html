<mat-tab-group mat-stretch-tabs="false">
  <mat-tab *ngIf="brpRechtenQuery.data()?.canZoeken">
    <ng-template mat-tab-label>
      <mat-icon>emoji_people</mat-icon>
      {{ "actie.zoeken.persoon" | translate }}
    </ng-template>
    <zac-persoon-zoek
      isSelectable
      (persoon)="klantGeselecteerd($event)"
    ></zac-persoon-zoek>
  </mat-tab>
  <mat-tab>
    <ng-template mat-tab-label>
      <mat-icon>business</mat-icon>
      {{ "actie.zoeken.bedrijf" | translate }}
    </ng-template>
    <zac-bedrijf-zoek
      isSelectable
      (bedrijf)="klantGeselecteerd($event)"
    ></zac-bedrijf-zoek>
  </mat-tab>
</mat-tab-group>
