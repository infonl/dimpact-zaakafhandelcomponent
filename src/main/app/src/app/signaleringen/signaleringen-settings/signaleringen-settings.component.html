<mat-card>
  <mat-card-content>
    <div
      class="table-wrapper"
      [ngClass]="{ 'table-loading-shade': isLoadingResults }"
    >
      <table
        mat-table
        [dataSource]="dataSource"
        [attr.aria-busy]="isLoadingResults"
      >
        <ng-container [matColumnDef]="column" *ngFor="let column of columns">
          <th mat-header-cell *matHeaderCellDef>
            {{ "signalering." + column | i18nKey | translate }}
          </th>
          <td mat-cell *matCellDef="let row">
            <ng-container *ngIf="column == 'type' || column == 'subjecttype'">
              {{
                "signalering." + column + "." + row[column]
                  | i18nKey
                  | translate
              }}
            </ng-container>
            <ng-container
              *ngIf="
                column != 'type' &&
                column != 'subjecttype' &&
                row[settingPerColumn[column]] != null
              "
            >
              <mat-checkbox
                (click)="$event.stopPropagation()"
                (change)="changed(row, column, $event.checked)"
                [checked]="row[settingPerColumn[column]]"
                [id]="row.type + '_' + column + '_checkbox'"
                [aria-label]="'actie.signalering.' + column | translate"
                [title]="'actie.signalering.' + column | translate"
              >
              </mat-checkbox>
            </ng-container>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns"></tr>
        <tr mat-row *matNoDataRow>
          <td [colSpan]="columns.length">
            {{ "msg.geen.gegevens.gevonden" | translate }}
          </td>
        </tr>
      </table>
    </div>
  </mat-card-content>
</mat-card>
