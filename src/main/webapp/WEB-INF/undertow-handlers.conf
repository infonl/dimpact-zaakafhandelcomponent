#
# Elytron OIDC answers an OIDC callback URL whose state cookie is missing or belongs to another login attempt
# with a 400 error instead of starting a new login. Redirect such a request to the same path without query
# parameters, so that Elytron starts a new login. Only redirect paths that start with a single slash, because
# browsers treat a Location header starting with '//' or '/\' as a URL on another host.
method(GET) and exists(%{q,code}) and not (exists(%{c,OAuth_Token_Request_State}) and equals(%{q,state}, %{c,OAuth_Token_Request_State})) and regex(pattern='^/([^/\\].*)?$', value='%U', full-match=true) -> redirect('%U')
