        condition: service_healthy
      redis:
        condition: service_started
    profiles: [ "openformulieren" ]

  openformulieren-nginx:
    image: nginxinc/nginx-unprivileged:1.31.3@sha256:d236224175e339a75199d10f7c1dd5d58f5ed1f7e347b13f5cf343218a1408d1
    ports:
      - "8007:8080"
    volumes:
      - ./scripts/docker-compose/imports/openformulieren/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
