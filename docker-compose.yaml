  openformulieren-web:
    image: openformulieren/open-forms:3.5.6@sha256:f5a5d51a44f39edcfb2143ae5d2ed9525b22ea377faa35fd2cce26b678f7fe83
    # For now, we do not override the platform from AMD to ARM for this Docker Image, because this results in a non-working Open Formulieren instance.
    # Using the INFO.nl Open Formulieren ARM image, when you create a new form and attempt to open it, you will see an error in the browser:
    # "Er ging helaas iets fout. Neem a.u.b. contact op met de helpdesk en informeer hen van dit probleem."
    # This seems to have to do with missing static content (such as JS translation bundles) in the ARM image.
    # You will also see a related 404 error on a JS translation bundle file in the browser when trying to open a form.
    platform: linux/amd64
    environment: *openformulieren-env
    ports:
      - "8009:8000"
    volumes: *openformulieren-volumes
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; exit(requests.head('http://localhost:8000/admin/').status_code not in [200, 302])" ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s
    depends_on:
      openformulieren-database:
        condition: service_healthy
      redis:
        condition: service_started
      openformulieren-init:
        condition: service_completed_successfully
    profiles: [ "openformulieren" ]

  openformulieren-celery:
    image: openformulieren/open-forms:3.5.6@sha256:f5a5d51a44f39edcfb2143ae5d2ed9525b22ea377faa35fd2cce26b678f7fe83
    # For now we do not override the platform from AMD to ARM for this Docker Image, because this results in a non-working Open Formulieren instance.
    # Using the INFO.nl Open Formulieren ARM image, when you create a new form and attempt to open it, you will see an error in the browser:
    # "Er ging helaas iets fout. Neem a.u.b. contact op met de helpdesk en informeer hen van dit probleem."
    # This seems to have to do with missing static content (such as JS translation bundles) in the ARM image.
    # You will also see a related 404 error on a JS translation bundle file in the browser when trying to open a form.
    platform: linux/amd64
    environment: *openformulieren-env
    command: /celery_worker.sh
    healthcheck:
      test: [ "CMD", "python", "/app/bin/check_celery_worker_liveness.py" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - openformulieren-media:/app/media
      - openformulieren-private-media:/app/private_media
      - openformulieren-log:/app/log
      - ./scripts/docker-compose/imports/openformulieren/settings/docker_local.py:/app/src/openforms/conf/docker_local.py:ro
    depends_on:
      openformulieren-database:
        condition: service_healthy
      redis:
        condition: service_started
    profiles: [ "openformulieren" ]

  openformulieren-celery-beat:
    image: openformulieren/open-forms:3.5.6@sha256:f5a5d51a44f39edcfb2143ae5d2ed9525b22ea377faa35fd2cce26b678f7fe83
    # For now we do not override the platform from AMD to ARM for this Docker Image, because this results in a non-working Open Formulieren instance.
    # Using the INFO.nl Open Formulieren ARM image, when you create a new form and attempt to open it, you will see an error in the browser:
    # "Er ging helaas iets fout. Neem a.u.b. contact op met de helpdesk en informeer hen van dit probleem."
    # This seems to have to do with missing static content (such as JS translation bundles) in the ARM image.
    # You will also see a related 404 error on a JS translation bundle file in the browser when trying to open a form.
    platform: linux/amd64
    environment: *openformulieren-env
    command: /celery_beat.sh
    volumes:
      - openformulieren-media:/app/media
      - openformulieren-private-media:/app/private_media
      - openformulieren-log:/app/log
      - ./scripts/docker-compose/imports/openformulieren/settings/docker_local.py:/app/src/openforms/conf/docker_local.py:ro
    depends_on:
