apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zaakafhandelcomponent.fullname" . }}
  labels:
    {{- include "zaakafhandelcomponent.labels" . | nindent 4 }}
stringData:
  AUTH_SECRET: "{{ required "Valid .Values.auth.secret entry required!" .Values.auth.secret | toString }}"
  BAG_API_KEY: "{{ required "Valid .Values.bagApi.apiKey entry required!" .Values.bagApi.apiKey | toString }}"
  BRON_ORGANISATIE_RSIN: "{{ required "Valid .Values.organizations.bron.rsin entry required!" .Values.organizations.bron.rsin | toString }}"
  {{- if .Values.brpApi.apiKey.value }}
  BRP_API_KEY: "{{ .Values.brpApi.apiKey.value | toString }}"
  {{- end }}
  BRP_API_KEY_HEADER: "{{ .Values.brpApi.apiKey.header | toString }}"
  BRP_LOG_LEVEL: "{{ .Values.brpApi.logLevel | default "INFO" | toString }}"
  {{- if .Values.brpApi.protocollering.enabled }}
  BRP_ORIGIN_OIN: "{{ .Values.brpApi.protocollering.originOin.oin | toString }}"
  BRP_TOEPASSING_HEADER: "{{ .Values.brpApi.protocollering.toepassing.header | toString }}"
  {{- if .Values.brpApi.protocollering.toepassing.header }}
  BRP_TOEPASSING: "{{ required "Valid .Values.brpApi.protocollering.toepassing.value entry required!" .Values.brpApi.protocollering.toepassing.value | toString }}"
  {{- end }}
  {{- end }}
  {{- if .Values.catalogusDomein }}
  CATALOGUS_DOMEIN: "{{ .Values.catalogusDomein | toString }}"
  {{- end }}
  DB_PASSWORD: "{{ required "Valid .Values.db.password entry required!" .Values.db.password | toString }}"
  GEMEENTE_CODE: "{{ required "Valid .Values.gemeente.code entry required!" .Values.gemeente.code | toString }}"
  GEMEENTE_MAIL: "{{ required "Valid .Values.gemeente.mail entry required!" .Values.gemeente.mail | toString }}"
  KEYCLOAK_ADMIN_CLIENT_ID: "{{ required "Valid .Values.keycloak.adminClient.id entry required!" .Values.keycloak.adminClient.id | toString }}"
  KEYCLOAK_ADMIN_CLIENT_SECRET: "{{ required "Valid .Values.keycloak.adminClient.secret entry required!" .Values.keycloak.adminClient.secret | toString }}"
  KLANTINTERACTIES_API_TOKEN: "{{ required "Valid .Values.klantinteractiesApi.token entry required!" .Values.klantinteractiesApi.token | toString }}"
  KVK_API_KEY: "{{ required "Valid .Values.kvkApi.apiKey entry required!" .Values.kvkApi.apiKey | toString }}"
  MP_HEALTH_EMPTY_LIVENESS_CHECKS_STATUS: "DOWN"
  MP_HEALTH_EMPTY_READINESS_CHECKS_STATUS: "DOWN"
  OBJECTS_API_TOKEN: "{{ required "Valid .Values.objectenApi.token entry required!" .Values.objectenApi.token | toString }}"
  OPEN_NOTIFICATIONS_API_SECRET_KEY: "{{ required "Valid .Values.notificationsSecretKey entry required!" .Values.notificationsSecretKey | toString }}"
  PABC_API_KEY: "{{ .Values.pabcApi.apiKey | toString }}"
  {{- if .Values.smartDocuments.enabled }}
  SMARTDOCUMENTS_AUTHENTICATION: "{{ required "Valid .Values.smartDocuments.authentication entry required!" .Values.smartDocuments.authentication | toString }}"
  {{- end }}
  {{- if .Values.mail.smtp.password }}
  SMTP_PASSWORD: "{{ .Values.mail.smtp.password | toString }}"
  {{- end }}
  SMTP_PORT: "{{ .Values.mail.smtp.port | toString }}"
  {{- if .Values.mail.smtp.username }}
  SMTP_USERNAME: "{{ .Values.mail.smtp.username | toString }}"
  {{- end }}
  VERANTWOORDELIJKE_ORGANISATIE_RSIN: "{{ required "Valid .Values.organizations.verantwoordelijke.rsin entry required!" .Values.organizations.verantwoordelijke.rsin | toString }}"
  ZAC_INTERNAL_ENDPOINTS_API_KEY: "{{ required "Valid .Values.zacInternalEndpointsApiKey entry required!" .Values.zacInternalEndpointsApiKey | toString }}"
  ZGW_API_SECRET: "{{ required "Valid .Values.zgwApis.secret entry required!" .Values.zgwApis.secret | toString }}"
