suite: Autoscaling
templates:
  - templates/config.yaml
  - templates/deployment.yaml
  - templates/secret.yaml
  - templates/hpa.yaml
  - templates/opa-deployment.yaml
  - templates/nginx-deployment.yaml
  - templates/nginx-hpa.yaml
  - templates/configmap-nginx.yaml
release:
  name: zac
values:
  - ../ci/zac-chart-test-values.yaml
tests:
  - it: uses a fixed number of replicas and no autoscaler when autoscaling is disabled
    set:
      replicaCount: 2
    asserts:
      - equal:
          path: spec.replicas
          value: 2
        template: templates/deployment.yaml
      - hasDocuments:
          count: 0
        template: templates/hpa.yaml
  - it: leaves the number of replicas to the autoscaler when autoscaling is enabled
    set:
      autoscaling.enabled: true
      autoscaling.minReplicas: 2
      autoscaling.maxReplicas: 5
    asserts:
      - notExists:
          path: spec.replicas
        template: templates/deployment.yaml
      - isKind:
          of: HorizontalPodAutoscaler
        template: templates/hpa.yaml
      - equal:
          path: spec.minReplicas
          value: 2
        template: templates/hpa.yaml
      - equal:
          path: spec.maxReplicas
          value: 5
        template: templates/hpa.yaml
  - it: creates the autoscaler with the autoscaling/v2 API, which Kubernetes 1.25 and newer still serve, scaling the ZAC deployment
    set:
      autoscaling.enabled: true
    asserts:
      - isAPIVersion:
          of: autoscaling/v2
        template: templates/hpa.yaml
      - equal:
          path: spec.scaleTargetRef
          value:
            apiVersion: apps/v1
            kind: Deployment
            name: zac-zaakafhandelcomponent
        template: templates/hpa.yaml
  - it: scales on the average CPU and memory utilization when both targets are set
    set:
      autoscaling.enabled: true
      autoscaling.targetCPUUtilizationPercentage: 75
      autoscaling.targetMemoryUtilizationPercentage: 85
    asserts:
      - equal:
          path: spec.metrics
          value:
            - type: Resource
              resource:
                name: cpu
                target:
                  type: Utilization
                  averageUtilization: 75
            - type: Resource
              resource:
                name: memory
                target:
                  type: Utilization
                  averageUtilization: 85
        template: templates/hpa.yaml
  - it: leaves the metrics to the Kubernetes default of 80% CPU when no target is set
    set:
      autoscaling.enabled: true
      autoscaling.targetCPUUtilizationPercentage: null
    asserts:
      - notExists:
          path: spec.metrics
        template: templates/hpa.yaml
  - it: refuses OPA autoscaling for a separate OPA deployment, because ZAC deploys its policies only to the OPA replicas that run when ZAC starts
    set:
      opa.sidecar: false
      opa.autoscaling.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: opa.autoscaling.enabled is no longer supported
        template: templates/opa-deployment.yaml
  - it: ignores a leftover OPA autoscaling setting when OPA runs as a sidecar, because OPA then scales with the ZAC pod
    set:
      opa.sidecar: true
      opa.autoscaling.enabled: true
    asserts:
      - notFailedTemplate: {}
        template: templates/opa-deployment.yaml
      - hasDocuments:
          count: 0
        template: templates/opa-deployment.yaml
  - it: uses the fixed number of OPA replicas for a separate OPA deployment
    set:
      opa.sidecar: false
      opa.replicas: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3
        template: templates/opa-deployment.yaml
  - it: scales the nginx deployment with its own autoscaler when nginx autoscaling is enabled
    set:
      nginx.enabled: true
      nginx.autoscaling.enabled: true
      nginx.autoscaling.minReplicas: 2
      nginx.autoscaling.maxReplicas: 4
    asserts:
      - notExists:
          path: spec.replicas
        template: templates/nginx-deployment.yaml
      - isAPIVersion:
          of: autoscaling/v2
        template: templates/nginx-hpa.yaml
      - isKind:
          of: HorizontalPodAutoscaler
        template: templates/nginx-hpa.yaml
      - equal:
          path: spec.scaleTargetRef.name
          value: zac-zaakafhandelcomponent-nginx
        template: templates/nginx-hpa.yaml
      - equal:
          path: spec.minReplicas
          value: 2
        template: templates/nginx-hpa.yaml
      - equal:
          path: spec.maxReplicas
          value: 4
        template: templates/nginx-hpa.yaml
  - it: creates no nginx autoscaler when nginx is disabled
    set:
      nginx.enabled: false
      nginx.autoscaling.enabled: true
    asserts:
      - hasDocuments:
          count: 0
        template: templates/nginx-hpa.yaml
  - it: uses a fixed number of nginx replicas and no nginx autoscaler when nginx autoscaling is disabled
    set:
      nginx.enabled: true
      nginx.replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3
        template: templates/nginx-deployment.yaml
      - hasDocuments:
          count: 0
        template: templates/nginx-hpa.yaml
