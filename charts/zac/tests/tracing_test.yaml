suite: Tracing of ZAC
templates:
  - templates/config.yaml
release:
  name: zac
values:
  - ../ci/zac-chart-test-values.yaml
tests:
  - it: leaves tracing off by default
    asserts:
      - notExists:
          path: data.OTEL_SDK_DISABLED
      - notExists:
          path: data.OTEL_EXPORTER_OTLP_ENDPOINT
  - it: sends the traces to the configured endpoint when tracing is enabled
    set:
      tracing.enabled: true
      tracing.endpoint: https://collector.example.com:4317
    asserts:
      - equal:
          path: data.OTEL_SDK_DISABLED
          value: "false"
      - equal:
          path: data.OTEL_EXPORTER_OTLP_ENDPOINT
          value: https://collector.example.com:4317
  - it: sends the traces to the bundled collector when tracing is enabled without an endpoint
    set:
      tracing.enabled: true
      opentelemetry-collector.enabled: true
    asserts:
      - equal:
          path: data.OTEL_SDK_DISABLED
          value: "false"
      - equal:
          path: data.OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://zac-opentelemetry-collector:4317
  - it: sends the traces to the configured endpoint instead of the bundled collector when both are configured
    set:
      tracing.enabled: true
      tracing.endpoint: https://collector.example.com:4317
      opentelemetry-collector.enabled: true
    asserts:
      - equal:
          path: data.OTEL_EXPORTER_OTLP_ENDPOINT
          value: https://collector.example.com:4317
  - it: rejects enabled tracing without an endpoint and without the bundled collector, instead of sending the traces nowhere
    set:
      tracing.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "tracing.enabled is true, but ZAC has no endpoint to send its traces to"
  - it: leaves tracing off when only an endpoint is configured, because only tracing.enabled turns it on
    set:
      tracing.endpoint: https://collector.example.com:4317
    asserts:
      - notExists:
          path: data.OTEL_SDK_DISABLED
      - notExists:
          path: data.OTEL_EXPORTER_OTLP_ENDPOINT
  - it: keeps sending the traces to the bundled collector of an existing installation that only enables the collector
    set:
      opentelemetry-collector.enabled: true
    asserts:
      - equal:
          path: data.OTEL_SDK_DISABLED
          value: "false"
      - equal:
          path: data.OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://zac-opentelemetry-collector:4317
  - it: keeps sending the traces to the deprecated endpoint of an existing installation
    set:
      opentelemetry_zaakafhandelcomponent.endpoint: https://collector.example.com:4317
    asserts:
      - equal:
          path: data.OTEL_SDK_DISABLED
          value: "false"
      - equal:
          path: data.OTEL_EXPORTER_OTLP_ENDPOINT
          value: https://collector.example.com:4317
  - it: prefers tracing.endpoint over the deprecated endpoint
    set:
      tracing.enabled: true
      tracing.endpoint: https://collector.example.com:4317
      opentelemetry_zaakafhandelcomponent.endpoint: https://deprecated-collector.example.com:4317
    asserts:
      - equal:
          path: data.OTEL_EXPORTER_OTLP_ENDPOINT
          value: https://collector.example.com:4317
