suite: OpenTelemetry tracing of ZAC
templates:
  - templates/config.yaml
release:
  name: zac
values:
  - ../ci/zac-chart-test-values.yaml
tests:
  - it: leaves tracing off by default, when neither the bundled collector nor an endpoint is configured
    asserts:
      - notExists:
          path: data.OTEL_SDK_DISABLED
      - notExists:
          path: data.OTEL_EXPORTER_OTLP_ENDPOINT
  - it: sends traces to the bundled collector when it is enabled and no endpoint is configured
    set:
      opentelemetry-collector.enabled: true
    asserts:
      - equal:
          path: data.OTEL_SDK_DISABLED
          value: "false"
      - equal:
          path: data.OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://zac-opentelemetry-collector:4317
  - it: sends traces to the configured endpoint instead of the bundled collector when both are configured
    set:
      opentelemetry-collector.enabled: true
      opentelemetry_zaakafhandelcomponent.endpoint: https://collector.example.com:4317
    asserts:
      - equal:
          path: data.OTEL_SDK_DISABLED
          value: "false"
      - equal:
          path: data.OTEL_EXPORTER_OTLP_ENDPOINT
          value: https://collector.example.com:4317
  - it: sends traces to an external collector at the configured endpoint when the bundled collector is disabled
    set:
      opentelemetry-collector.enabled: false
      opentelemetry_zaakafhandelcomponent.endpoint: https://collector.example.com:4317
    asserts:
      - equal:
          path: data.OTEL_SDK_DISABLED
          value: "false"
      - equal:
          path: data.OTEL_EXPORTER_OTLP_ENDPOINT
          value: https://collector.example.com:4317
