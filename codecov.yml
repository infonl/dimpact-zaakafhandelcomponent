# When modifying this file, please check if it is valid using the following command:
# `curl --data-binary @codecov.yml https://codecov.io/validate`
# See: https://docs.codecov.com/docs/codecov-yaml
codecov:
  notify:
    # Only notify Codecov after all coverage uploads of a commit have arrived, so that the reported
    # coverage includes the frontend and backend unit tests and every integration test shard:
    # 1 backend unit test report + 2 frontend unit test shards ('frontend-unit-tests' matrix) +
    # 3 integration test shards ('itest-shard' matrix) in build-test-deploy.yml.
    # Update these numbers when the number of shards changes.
    after_n_builds: 6
  max_report_age: off
coverage:
  status:
    project:
      default:
        # Allow the coverage to drop a little bit before failing the Codecov check.
        # This to avoid failing Codecov checks when the coverage drops with e.g. 0.01%
        # even when there are no changes made to the code.
        threshold: "1"
flag_management:
  individual_flags:
    - name: backendunittests
      after_n_builds: 1
    - name: frontendunittests
      after_n_builds: 2
    - name: integrationtests
      # one upload per integration test shard
      after_n_builds: 3