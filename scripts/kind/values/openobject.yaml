#
# Values for the maykinmedia/openobject chart (release 'openobject'). scripts/kind/up.sh adds the image, the
# passwords and, with Open Notificaties, the Celery worker that sends the notifications.
replicaCount: 1

tags:
  redis: false

settings:
  allowedHosts: open-object.local,localhost,127.0.0.1,host.docker.internal
  siteDomain: open-object.local:8000
  cache:
    default: redis:6379/0
    axes: redis:6379/0
    oidc: redis:6379/0
  celery:
    brokerUrl: redis://redis:6379/4
    resultBackend: redis://redis:6379/4
  isHttps: false
  disable2fa: true

persistence:
  enabled: false

# Open Object 4.2 renamed UWSGI_PORT to OPENOBJECT_PORT. The Kubernetes Service named openobject injects
# OPENOBJECT_PORT=tcp://<cluster-ip>:80 into the pods, which uWSGI then reads as its bind address. A container
# variable overrides the injected one.
extraEnvVars:
  - name: OPENOBJECT_PORT
    value: "8000"

startupProbe:
  initialDelaySeconds: 5
  periodSeconds: 2
  timeoutSeconds: 5
  failureThreshold: 300
readinessProbe:
  initialDelaySeconds: 0
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 6

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# without a set concurrency the chart starts 4 Celery worker processes, which cost ~150 MiB each
worker:
  concurrency: 2
flower:
  enabled: false
