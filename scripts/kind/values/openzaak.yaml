#
# Values for the maykinmedia/openzaak chart (release 'openzaak'), mirroring the Open Zaak services of
# docker-compose.yaml. scripts/kind/up.sh adds the image, the database settings, the secret key and the superuser
# of docker-compose.yaml.
replicaCount: 1

# Redis comes from the zac-dev chart, shared by every component as in Docker Compose
tags:
  redis: false

settings:
  allowedHosts: openzaak.local,openzaak-nginx,localhost,host.docker.internal
  cache:
    default: redis:6379/0
    axes: redis:6379/0
  celery:
    brokerUrl: redis://redis:6379/1
    resultBackend: redis://redis:6379/1
  isHttps: false
  disable2fa: true
  notificationsDisabled: true

# a ReadWriteOnce volume of the zac-dev chart, which also seeds it with the test documents of the test data
persistence:
  enabled: true
  existingClaim: openzaak-media

startupProbe:
  initialDelaySeconds: 5
  periodSeconds: 2
  timeoutSeconds: 5
  failureThreshold: 300
readinessProbe:
  initialDelaySeconds: 0
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 5

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# Docker Compose runs the Celery worker only with Open Notificaties, which this stack does not have
worker:
  replicaCount: 0
beat:
  replicaCount: 0
flower:
  enabled: false

# everything reaches Open Zaak through nginx, as in Docker Compose; the limits are those of
# scripts/docker-compose/imports/openzaak/nginx/nginx.conf
nginx:
  config:
    clientMaxBodySize: 600m
    proxyReadTimeoutSeconds: 1800
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 256Mi
