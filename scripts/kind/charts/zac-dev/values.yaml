  hostname: ""
  # -- the e-mail addresses of the test users and groups of the realm, which DOCKER_COMPOSE_<NAME>_EMAIL_ADDRESS
  # in .env overrides
  emailAddresses:
    ZAC_RAADPLEGER_TEST_1_EMAIL_ADDRESS: raadpleger-test-1@example.com
    ZAC_RAADPLEGER_TEST_2_EMAIL_ADDRESS: raadpleger-test-2@example.com
