    ZAC_BEHANDELAAR_TEST_2_EMAIL_ADDRESS: behandelaar-test-2@example.com
    ZAC_COORDINATOR_TEST_1_EMAIL_ADDRESS: coordinator-test-1@example.com
    ZAC_COORDINATOR_TEST_2_EMAIL_ADDRESS: coordinator-test-2@example.com
    ZAC_RECORDMANAGER_TEST_1_EMAIL_ADDRESS: recordmanager-test-1@example.com
    ZAC_RECORDMANAGER_TEST_2_EMAIL_ADDRESS: recordmanager-test-2@example.com
    ZAC_BEHEERDER_TEST_1_EMAIL_ADDRESS: beheerder-test-1@example.com
    ZAC_RAADPLEGER_EN_BEHANDELAAR_TEST_1_EMAIL_ADDRESS: raadpleger-en-behandelaar-test-1@example.com
    ZAC_ZAAKSPECIFIEK_AUTORISATIE_BEHANDELAAR_TEST_1_EMAIL_ADDRESS: zaakspecifiek-autorisatie-behandelaar-test-1@example.com
    ZAC_BEHANDELAAR_EN_BRP_ZOEKER_TEST_1_EMAIL_ADDRESS: behandelaar-en-brp-zoeker-test-1@example.com
    ZAC_GROUP_RAADPLEGERS_TEST_1_EMAIL_ADDRESS: test-group-raadplegers-test-1@example.com
    ZAC_GROUP_RAADPLEGERS_TEST_2_EMAIL_ADDRESS: test-group-raadplegers-test-2@example.com
    ZAC_GROUP_BEHANDELAARS_TEST_1_EMAIL_ADDRESS: test-group-behandelaars-test-1@example.com
    ZAC_GROUP_BEHANDELAARS_TEST_2_EMAIL_ADDRESS: test-group-behandelaars-test-2@example.com
    ZAC_GROUP_COORDINATORS_TEST_1_EMAIL_ADDRESS: test-group-coordinators-test-1@example.com
    ZAC_GROUP_COORDINATORS_TEST_2_EMAIL_ADDRESS: test-group-coordinators-test-2@example.com
    ZAC_GROUP_RECORDMANAGERS_TEST_1_EMAIL_ADDRESS: test-group-recordmanagers-test-1@example.com
    ZAC_GROUP_RECORDMANAGERS_TEST_2_EMAIL_ADDRESS: test-group-recordmanagers-test-2@example.com
    ZAC_GROUP_BEHEERDERS_ELK_DOMEIN_EMAIL_ADDRESS: test-group-beheerders-elk-domein@example.com
    ZAC_GROUP_BEHANDELAARS_LONG_NAME_TEST_EMAIL_ADDRESS: test-group-behandelaars-long-name-test@example.com
    ZAC_GROUP_ZAAKSPECIFIEK_AUTORISATIE_BEHANDELAARS_TEST_1_EMAIL_ADDRESS: test-group-zaakspecifiek-autorisatie-behandelaars-test-1@example.com
    ZAC_GROUP_BRP_ZOEKERS_TEST_2_EMAIL_ADDRESS: test-group-brp-zoekers-test-2@example.com

pabc:
  apiImage: ghcr.io/platform-autorisatie-beheer-component/pabc-api:2.1.0@sha256:7e4f906ea46ba4eace1997a074099a5a54038e38901890d486d117583861a61d
  migrationsImage: ghcr.io/platform-autorisatie-beheer-component/pabc-migrations:2.1.0@sha256:75640f1ee9dc6a155800a31457574b9c36eb0cd41827c45333b9f39d05c94abb
  # -- the settings of PABC, next to its database connection; the client secrets are those of the Keycloak realm
  env:
    ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    HTTP_PORTS: "8000"
    API_KEY__0: zac-test-api-key
    Oidc__Authority: http://keycloak:8080/realms/zaakafhandelcomponent/
    Oidc__ClientId: pabc
    Oidc__ClientSecret: pabcClientSecret
    Oidc__FunctioneelBeheerderRole: administrator
    Oidc__RequireHttps: "false"
    KeycloakAdmin__ClientId: pabc-admin-client
    KeycloakAdmin__ClientSecret: pabcAdminClientSecret
    KeycloakAdmin__ExcludedRoles__0: offline_access
    KeycloakAdmin__ExcludedRoles__1: uma_authorization
    KeycloakAdmin__ExcludedRoles__2: default-roles-zac
    # PABC would need the Open Zaak URLs of the browser and of the cluster to match
    ZgwZaakregister__Enabled: "false"
    ZgwZaakregister__CatalogiBaseUrl: http://localhost:8001/catalogi/api/v1/
    ZgwZaakregister__ClientId: pabc
    ZgwZaakregister__ClientSecret: pabcClientSecretWithExtraPadding
    ZgwZaakregister__CatalogusDomein: ALG

solr:
  image: solr:9.11.0-slim@sha256:c8a5ad7d951c00f15d5847ba0a94c1ab212de42de10668b80848831b72d75b9f

opa:
  # -- keep in sync with the OPA of charts/zac
  image: openpolicyagent/opa:1.21.3-static@sha256:bf27411c17e72f3d16063725a74c69f711fb267eb9a4cebdae78028b72adc847

officeConverter:
  # -- keep in sync with the office converter of charts/zac
  image: gotenberg/gotenberg:8.38.1@sha256:aa552cc115db488e0f0bcb07446aac13071ad51505b642c84bb894500907b42b
  username: zac

brpPersonenMock:
  image: ghcr.io/brp-api/personen-mock:2.7.0-202610201628@sha256:613605a8e613e0610d5209b67e8371ea5355085834951bfe105d9e4229d4571a

wiremock:
  image: wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3

greenmail:
  image: greenmail/standalone:2.1.14@sha256:1ef95a966418cd09b7ea91d504d8c0826bbe7a2f6e679a75c601a831587c1626


# -- the optional services, which the options of ./start-kind.sh switch on
profiles:
  # -- Open Object (-o, and with -t and -f)
  objecten: false
  # -- the test doubles of the integration tests: WireMock for SmartDocuments, KVK and BAG, and GreenMail (-t)
  itest: false
  # -- Open Notificaties (-n, and with -f)
  opennotificaties: false
  # -- Open Archiefbeheer (-a)
  openarchiefbeheer: false
  # -- Open Formulieren (-f)
  openformulieren: false

# -- run OPA and the office converter for a ZAC that runs outside the cluster, for example in an IDE; the ZAC
# Helm chart brings its own when ZAC runs in the cluster
zacOutsideCluster: false

# -- the storage class of the kind cluster
storageClassName: standard

# -- the Secret with the generated passwords, created by scripts/kind/up.sh
generatedSecret: zac-dev-generated

# -- NodePorts that the port proxy container of scripts/kind/up.sh publishes on the host, from scripts/kind/ports.json
ports: []
