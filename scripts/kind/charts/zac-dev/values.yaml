#
# The source of truth of the kind stack: the images of every service, also those of the upstream charts, and the
# versions of those charts. scripts/kind/values/arm64.yaml replaces the images on an arm64 host. scripts/kind/up.sh
# passes the images of the upstream charts on to their releases.

# -- the upstream Helm charts that scripts/kind/up.sh installs next to this chart
upstreamCharts:
  openzaak:
    repository: https://maykinmedia.github.io/charts/
    version: 1.15.0
  # 1.11.0 is the chart of Open Klant 2.15.0: later charts probe /_healthz/, which 2.15.0 does not have
  openklant:
    repository: https://maykinmedia.github.io/charts/
    version: 1.11.0
  openobject:
    repository: https://maykinmedia.github.io/charts/
    version: 1.2.0
  opennotificaties:
    repository: https://maykinmedia.github.io/charts/
    version: 2.1.0
  openarchiefbeheer:
    repository: https://maykinmedia.github.io/charts/
    version: 2.1.0
  openforms:
    repository: https://maykinmedia.github.io/charts/
    version: 1.13.0

openzaak:
  image: openzaak/open-zaak:1.31.0@sha256:d25566131129d5013ea936a2b25ea40e567fd3aa38120335aa552ba54e76300c
openklant:
  image: maykinmedia/open-klant:2.15.0@sha256:ce59a2c60dab1c14e62fe34a99511839390dd2d482983c27334241e0d60c693d
openobject:
  image: maykinmedia/open-object:4.1.1@sha256:593571842b4af655383964fb3fa869b62313e7cd1e56a02f173afa8e4713c4b6
opennotificaties:
  image: openzaak/open-notificaties:1.17.0@sha256:5200540e78eb67993760bd9ad98d6c7f174ce61f5122b3e20627a690cbf3dfe0
openarchiefbeheer:
  image: maykinmedia/open-archiefbeheer:2.0.0@sha256:e5217d748869c62d26393311c3cfdcaacf69d8dde80ca3bc172ff41f3885f0ff
# no arm64 image: the arm64 build of Open Formulieren lacks static files that the form editor needs
openforms:
  image: openformulieren/open-forms:3.5.11@sha256:594ab8d2c4e8de13d86ef9a4e97296da008c02ec63c19d9471d1bc82883c95c8
# the nginx of the upstream charts and the container that publishes the ports on the host
nginx:
  image: nginxinc/nginx-unprivileged:1.31.7@sha256:94193d5c4c5df716f412bb08eb97956d98fe6b59886f0bc57d6d3a3402a88a02

# -- one PostGIS server for the databases of every component
postgres:
  image: postgis/postgis:17-3.4@sha256:d0b5a6ecab18997637f55a83cb4a9467391de5645916cfa1b6f2a8d19eee7be5
  # -- the databases and their owners; scripts/kind/up.sh generates their passwords
  databases:
    - name: zac
      owner: zac
    - name: openzaak
      owner: openzaak
    - name: openklant
      owner: openklant
    - name: objects
      owner: objects
    - name: keycloak
      owner: keycloak
    - name: Pabc
      owner: pabc
    - name: opennotificaties
      owner: opennotificaties
    - name: openarchiefbeheer
      owner: openarchiefbeheer
    - name: openformulieren
      owner: openformulieren

redis:
