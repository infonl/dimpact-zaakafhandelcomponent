    ZAC_GROUP_BRP_ZOEKERS_TEST_2_EMAIL_ADDRESS: test-group-brp-zoekers-test-2@example.com

pabc:
  apiImage: ghcr.io/platform-autorisatie-beheer-component/pabc-api:2.1.0@sha256:7e4f906ea46ba4eace1997a074099a5a54038e38901890d486d117583861a61d
  migrationsImage: ghcr.io/platform-autorisatie-beheer-component/pabc-migrations:2.1.0@sha256:75640f1ee9dc6a155800a31457574b9c36eb0cd41827c45333b9f39d05c94abb
  # -- the settings of PABC, next to its database connection; the client secrets are those of the Keycloak realm
  env:
    ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    HTTP_PORTS: "8000"
    API_KEY__0: zac-test-api-key
    Oidc__Authority: http://keycloak:8080/realms/zaakafhandelcomponent/
    Oidc__ClientId: pabc
    Oidc__ClientSecret: pabcClientSecret
    Oidc__FunctioneelBeheerderRole: administrator
    Oidc__RequireHttps: "false"
    KeycloakAdmin__ClientId: pabc-admin-client
    KeycloakAdmin__ClientSecret: pabcAdminClientSecret
    KeycloakAdmin__ExcludedRoles__0: offline_access
    KeycloakAdmin__ExcludedRoles__1: uma_authorization
    KeycloakAdmin__ExcludedRoles__2: default-roles-zac
    # PABC would need the Open Zaak URLs of the browser and of the cluster to match
    ZgwZaakregister__Enabled: "false"
    ZgwZaakregister__CatalogiBaseUrl: http://localhost:8001/catalogi/api/v1/
    ZgwZaakregister__ClientId: pabc
    ZgwZaakregister__ClientSecret: pabcClientSecretWithExtraPadding
    ZgwZaakregister__CatalogusDomein: ALG

solr:
  image: solr:9.11.0-slim@sha256:54cec2ced0f2c26436605a7dd5dde5ae78f26d5c0d19a7358349d5cb71fdfc1a

opa:
  # -- keep in sync with the OPA of charts/zac
  image: openpolicyagent/opa:1.22.2-static@sha256:805656c845fb626b856fb4b4799d6c91e053a41eecc48537f4f1c2fd6974fbdd

officeConverter:
  # -- keep in sync with the office converter of charts/zac
  image: gotenberg/gotenberg:8.40.0@sha256:53073e798c8ef39ea2187e44cb67bab77894ea2509100b94c4fe3b461f7b2996
  username: zac

brpPersonenMock:
  image: ghcr.io/brp-api/personen-mock:2.7.0-202610201628@sha256:613605a8e613e0610d5209b67e8371ea5355085834951bfe105d9e4229d4571a

wiremock:
  image: wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3

greenmail:
  image: greenmail/standalone:2.1.15@sha256:309ba544ea482e5d4265d09921cdab07c8dad2cc4481d715c9b8ff5d3f0a149f


# -- the optional services, which the options of ./start-kind.sh switch on
profiles:
  # -- Open Object (-o, and with -t and -f)
  objecten: false
  # -- the test doubles of the integration tests: WireMock for SmartDocuments, KVK and BAG, and GreenMail (-t)
  itest: false
  # -- Open Notificaties (-n, and with -f)
  opennotificaties: false
  # -- Open Archiefbeheer (-a)
  openarchiefbeheer: false
  # -- Open Formulieren (-f)
  openformulieren: false
  # -- VNG Selectielijst (-v)
  vngselectielijst: false

# -- run OPA and the office converter for a ZAC that runs outside the cluster, for example in an IDE; the ZAC
# Helm chart brings its own when ZAC runs in the cluster
zacOutsideCluster: false

# -- the storage class of the kind cluster
storageClassName: standard

# -- the Secret with the passwords of the stack, created by scripts/kind/up.sh
generatedSecret: zac-dev-generated

# -- NodePorts that the port proxy container of scripts/kind/up.sh publishes on the host, from scripts/kind/ports.json
ports: []
