#
# Standalone Solr with basic authentication and a pre-created 'zac' core, as in Docker Compose.
# The ZAC chart's own option, SolrCloud through the solr-operator with three ZooKeepers, is too heavy for a laptop.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: solr-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storageClassName }}
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: solr
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: solr
  template:
    metadata:
      labels:
        app: solr
    spec:
      enableServiceLinks: false
      securityContext:
        {{- include "zac-dev.podSecurityContext" . | nindent 8 }}
        # the 'solr' user of the image
        runAsUser: 8983
        runAsGroup: 8983
        fsGroup: 8983
      initContainers:
        - name: security
          image: {{ include "zac-dev.image" (list . "solr") }}
          command: ["sh", "-c", "mkdir -p /var/solr/data && cp /opt/zac/security.json /var/solr/data/security.json"]
          securityContext:
            {{- include "zac-dev.nonRootContainerSecurityContext" . | nindent 12 }}
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /var/solr
            - name: security
              mountPath: /opt/zac
      containers:
        - name: solr
          image: {{ include "zac-dev.image" (list . "solr") }}
          command: ["solr-precreate", "zac"]
          ports:
            - containerPort: 8983
          readinessProbe:
            tcpSocket:
              port: 8983
            periodSeconds: 2
          securityContext:
            {{- include "zac-dev.nonRootContainerSecurityContext" . | nindent 12 }}
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/solr
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: solr-data
        - name: security
          configMap:
            name: solr-security
---
apiVersion: v1
kind: Service
metadata:
  name: solr
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: solr
  ports:
    - port: 8983
      targetPort: 8983
