{{- /* WireMock test doubles, with the mappings and files of scripts/docker-compose/imports as ConfigMaps. */}}
{{- range $wiremock := list
  (dict "name" "smartdocuments-wiremock" "files" true "templating" true)
  (dict "name" "kvk-wiremock" "files" true "templating" true)
  (dict "name" "bag-wiremock" "files" true "templating" true)
  (dict "name" "brp-personen-wiremock" "files" false "templating" false) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $wiremock.name }}
  namespace: {{ $.Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $wiremock.name }}
  template:
    metadata:
      labels:
        app: {{ $wiremock.name }}
    spec:
      enableServiceLinks: false
      securityContext:
        {{- include "zac-dev.podSecurityContext" $ | nindent 8 }}
      containers:
        - name: wiremock
          image: {{ include "zac-dev.image" (list $ "wiremock") }}
          args:
            {{- if $wiremock.templating }}
            - --global-response-templating
            {{- end }}
            - --disable-gzip
            - --verbose
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /__admin/health
              port: 8080
            periodSeconds: 2
          securityContext:
            {{- include "zac-dev.containerSecurityContext" $ | nindent 12 }}
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: mappings
              mountPath: /home/wiremock/mappings
            # WireMock creates this directory when it is missing, which a read-only root file system does not allow
            - name: files
              mountPath: /home/wiremock/__files
      volumes:
        - name: tmp
          emptyDir: {}
        - name: mappings
          configMap:
            name: {{ $wiremock.name }}-mappings
        - name: files
          {{- if $wiremock.files }}
          configMap:
            name: {{ $wiremock.name }}-files
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $wiremock.name }}
  namespace: {{ $.Release.Namespace }}
spec:
  selector:
    app: {{ $wiremock.name }}
  ports:
    - port: 8080
      targetPort: 8080
{{- end }}
---
# The BRP personen mock behind brp-personen-wiremock, which proxies to http://brp-personen-mock:5010
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brp-personen-mock
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: brp-personen-mock
  template:
    metadata:
      labels:
        app: brp-personen-mock
    spec:
      enableServiceLinks: false
      securityContext:
        {{- include "zac-dev.podSecurityContext" . | nindent 8 }}
      containers:
        - name: brp-personen-mock
          image: {{ include "zac-dev.image" (list . "brpPersonenMock") }}
          envFrom:
            - secretRef:
                name: brp-personen-mock-compose-env
          ports:
            - containerPort: 5010
          readinessProbe:
            tcpSocket:
              port: 5010
            periodSeconds: 2
          securityContext:
            {{- include "zac-dev.containerSecurityContext" . | nindent 12 }}
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: brp-personen-mock
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: brp-personen-mock
  ports:
    - port: 5010
      targetPort: 5010
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greenmail
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greenmail
  template:
    metadata:
      labels:
        app: greenmail
    spec:
      enableServiceLinks: false
      securityContext:
        {{- include "zac-dev.podSecurityContext" . | nindent 8 }}
      containers:
        - name: greenmail
          image: {{ include "zac-dev.image" (list . "greenmail") }}
          envFrom:
            - secretRef:
                name: greenmail-compose-env
          ports:
            - containerPort: 25
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            # SMTP on port 25, as in Docker Compose
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: greenmail
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: greenmail
  ports:
    - name: smtp
      port: 25
      targetPort: 25
    - name: api
      port: 8080
      targetPort: 8080
