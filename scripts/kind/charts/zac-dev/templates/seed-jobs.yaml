#
# Seed data that Docker Compose loads with one-off containers. Every 'helm upgrade' runs these Jobs again under a
# new name, so each of them is idempotent.

# The media volume of the openzaak release, with the documents that the Open Zaak test data refers to, like
# scripts/docker-compose/imports/openzaak/zac-scripts/copy-test-pdf-and-start-openzaak.sh in Docker Compose. The
# ReadWriteMany claim of the openzaak chart needs a storage class that kind does not have.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openzaak-media
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storageClassName }}
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-openzaak-media-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zac-dev.seedJobLabels" . | nindent 4 }}
spec:
  backoffLimit: 3
  template:
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      securityContext:
        {{- include "zac-dev.podSecurityContext" . | nindent 8 }}
        # the user of the Open Zaak image, which adds uploads next to these documents
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: copy
          image: {{ include "zac-dev.image" (list . "postgres") }}
          command:
            - sh
            - -c
            - |
              set -e
              for month in 10 11 12; do
                mkdir -p /app/private-media/uploads/2023/$month
                cp /seed/fake-test-document.pdf /app/private-media/uploads/2023/$month/
              done
          securityContext:
            {{- include "zac-dev.nonRootContainerSecurityContext" . | nindent 12 }}
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            # the subPath of the openzaak chart for private media
            - name: media
              mountPath: /app/private-media
              subPath: openzaak/private_media
            - name: seed
              mountPath: /seed
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: openzaak-media
        - name: seed
          configMap:
            name: seed-openzaak-uploads
---
# The Open Klant test data, like scripts/docker-compose/imports/openklant-database/fill-data-on-startup.sh in
# Docker Compose: once Open Klant has migrated its database, and only into an empty database.
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-openklant-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zac-dev.seedJobLabels" . | nindent 4 }}
spec:
  backoffLimit: 3
  template:
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      securityContext:
        {{- include "zac-dev.podSecurityContext" . | nindent 8 }}
      containers:
        - name: psql
          image: {{ include "zac-dev.image" (list . "postgres") }}
          envFrom:
            - secretRef:
                name: openklant-database-access
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              migrations=$(sed -n 's/^DJANGO_MIGRATIONS_TABLE_RECORDS_COUNT=//p' /seed/fill-data-on-startup.sh)
              until [ "$(psql -At -c "SELECT count(*) FROM django_migrations" 2> /dev/null || echo 0)" -ge "$migrations" ]; do
                echo "waiting for the Open Klant migrations"; sleep 2
              done
              if [ "$(psql -At -c "SELECT count(*) FROM token_tokenauth")" = 0 ]; then
                for file in /seed/*.sql; do
                  psql --set ON_ERROR_STOP=1 --file "$file"
                done
              fi
          securityContext:
            {{- include "zac-dev.nonRootContainerSecurityContext" . | nindent 12 }}
            runAsUser: 999
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: seed
              mountPath: /seed
      volumes:
        - name: seed
          configMap:
            name: seed-openklant
---
# The Open Object test data and admin user, with scripts/docker-compose/imports/open-object/init/init.sh like the
# open-object-import container of Docker Compose, once Open Object has migrated its database
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-openobject-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zac-dev.seedJobLabels" . | nindent 4 }}
spec:
  backoffLimit: 3
  template:
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      securityContext:
        {{- include "zac-dev.podSecurityContext" . | nindent 8 }}
      containers:
        - name: loaddata
          image: {{ include "zac-dev.image" (list . "openObject") }}
          envFrom:
            # the settings of the openobject release
            - configMapRef:
                name: openobject
            - secretRef:
                name: openobject
          workingDir: /app
          command:
            - sh
            - -c
            - |
              set -e
              until python /app/src/manage.py migrate --check > /dev/null 2>&1; do
                echo "waiting for the Open Object migrations"; sleep 3
              done
              sh /app/init/init.sh
          securityContext:
            {{- include "zac-dev.nonRootContainerSecurityContext" . | nindent 12 }}
            # the 'maykin' user of the image
            runAsUser: 1000
            # not read-only: Open Object writes outside /tmp, and 'manage.py migrate --check' then never succeeds
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: fixtures
              mountPath: /app/src/objects/fixtures
            - name: init
              mountPath: /app/init
      volumes:
        - name: fixtures
          configMap:
            name: seed-objecten-fixtures
        - name: init
          configMap:
            name: seed-objecten-init
