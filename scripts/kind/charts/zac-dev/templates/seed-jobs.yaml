#
# The seed data and the configuration of the components that the upstream charts install. Every 'helm upgrade' runs
# these Jobs again under a new name, so each of them is idempotent. Each Job waits until its component has migrated
# its database, which it does before it starts to listen.

# The documents that the Open Zaak test data refers to, in the media volume of the openzaak release
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-openzaak-media-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zac-dev.seedJobLabels" . | nindent 4 }}
spec:
  backoffLimit: 3
  template:
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      securityContext:
        {{- include "zac-dev.podSecurityContext" . | nindent 8 }}
        # the user of the Open Zaak image, which adds uploads next to these documents
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: copy
          image: {{ .Values.postgres.image }}
          command:
            - sh
            - -c
            - |
              set -e
              for month in 10 11 12; do
                mkdir -p /app/private-media/uploads/2023/$month
                cp /seed/fake-test-document.pdf /app/private-media/uploads/2023/$month/
              done
          securityContext:
            {{- include "zac-dev.nonRootContainerSecurityContext" . | nindent 12 }}
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            # the subPath of the openzaak chart for private media
            - name: media
              mountPath: /app/private-media
              subPath: openzaak/private_media
            - name: seed
              mountPath: /seed
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: openzaak-media
        - name: seed
          configMap:
            name: seed-openzaak-uploads
---
# The Open Klant test data, only into an empty database
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-openklant-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zac-dev.seedJobLabels" . | nindent 4 }}
spec:
  backoffLimit: 3
  template:
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      securityContext:
        {{- include "zac-dev.podSecurityContext" . | nindent 8 }}
      containers:
        - name: psql
          image: {{ .Values.postgres.image }}
          env:
            - name: PGHOST
              value: openklant-database
            - name: PGUSER
              value: openklant
            - name: PGDATABASE
              value: openklant
            {{- include "zac-dev.generatedSecretEnv" (list . "PGPASSWORD" "db-password-openklant") | nindent 12 }}
            {{- include "zac-dev.generatedSecretEnv" (list . "ADMIN_PASSWORD_HASH" "admin-password-hash") | nindent 12 }}
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              {{ include "zac-dev.waitForPort" (list "openklant-local" 8000) }}
              if [ "$(psql -At -c "SELECT count(*) FROM token_tokenauth")" = 0 ]; then
                psql --set ON_ERROR_STOP=1 --set admin_password_hash="$ADMIN_PASSWORD_HASH" \
                  --file /seed/1-setup-applicatie.sql
              fi
          securityContext:
            {{- include "zac-dev.nonRootContainerSecurityContext" . | nindent 12 }}
            runAsUser: 999
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: seed
              mountPath: /seed
      volumes:
        - name: seed
          configMap:
            name: seed-openklant
{{- if include "zac-dev.objecten" . }}
---
# The Open Object test data
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-openobject-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zac-dev.seedJobLabels" . | nindent 4 }}
spec:
  backoffLimit: 3
  template:
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      securityContext:
        {{- include "zac-dev.podSecurityContext" . | nindent 8 }}
      containers:
        - name: loaddata
          image: {{ .Values.openobject.image }}
          envFrom:
            # the settings of the openobject release
            - configMapRef:
                name: openobject
            - secretRef:
                name: openobject
          env:
            {{- include "zac-dev.generatedSecretEnv" (list . "ADMIN_PASSWORD" "admin-password") | nindent 12 }}
          workingDir: /app
          command:
            - bash
            - -c
            - |
              set -e
              {{ include "zac-dev.waitForPort" (list "open-object-local" 8000) }}
              python /app/src/manage.py loaddata demodata
              {{- include "zac-dev.createAdminUser" "/app/src/manage.py" | nindent 14 }}
          securityContext:
            {{- include "zac-dev.nonRootContainerSecurityContext" . | nindent 12 }}
            # the 'maykin' user of the image
            runAsUser: 1000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: fixtures
              mountPath: /app/src/objects/fixtures
      volumes:
        - name: fixtures
          configMap:
            name: seed-objecten-fixtures
{{- end }}
