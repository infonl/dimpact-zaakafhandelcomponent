{{- if .Values.profiles.openformulieren }}
---
# The services of Open Formulieren, its 'admin' user and the productaanvraag-Dimpact test form
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-openformulieren-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zac-dev.seedJobLabels" . | nindent 4 }}
spec:
  backoffLimit: 3
  template:
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      securityContext:
        {{- include "zac-dev.podSecurityContext" . | nindent 8 }}
      containers:
        - name: setup-configuration
          image: {{ .Values.openforms.image }}
          envFrom:
            - configMapRef:
                name: openforms
            - secretRef:
                name: openforms
          env:
            {{- include "zac-dev.generatedSecretEnv" (list . "ADMIN_PASSWORD" "admin-password") | nindent 12 }}
            - name: OTEL_SDK_DISABLED
              value: "true"
          command:
            - bash
            - -c
            - |
              set -e
              {{ include "zac-dev.waitForPort" (list "openforms" 8000) }}
              python src/manage.py setup_configuration --yaml-file /seed/configuration/data.yaml
              {{- include "zac-dev.createAdminUser" "src/manage.py" | nindent 14 }}
              python src/manage.py shell -c "
              from openforms.contrib.haal_centraal.models import HaalCentraalConfig
              from zgw_consumers.models import Service
              config = HaalCentraalConfig.get_solo()
              if not config.brp_personen_service_id:
                  config.brp_personen_service = Service.objects.get(slug='brp-personen')
                  config.save()
              "
              python src/manage.py shell -c "
              from openforms.contrib.customer_interactions.models import CustomerInteractionsAPIGroupConfig
              from zgw_consumers.models import Service
              IDENTIFIER = 'klantinteracties-api-group'
              if not CustomerInteractionsAPIGroupConfig.objects.filter(identifier=IDENTIFIER).exists():
                  CustomerInteractionsAPIGroupConfig.objects.create(
                      name='Local Klantinteracties API',
                      identifier=IDENTIFIER,
                      customer_interactions_service=Service.objects.get(slug='openklant-klantinteracties'),
                  )
              "
              python src/manage.py shell -c "
              import glob, os, zipfile
              from openforms.forms.models import Form
              from openforms.forms.utils import import_form
              FORM_SLUG = 'productaanvraag-dimpact-test-formulier-compleet'
              if not Form.objects.filter(slug=FORM_SLUG).exists():
                  with zipfile.ZipFile('/tmp/forms.zip', 'w', zipfile.ZIP_DEFLATED) as forms_zip:
                      for form_file in glob.glob('/seed/forms/*.json'):
                          forms_zip.write(form_file, os.path.basename(form_file))
                  with open('/tmp/forms.zip', 'rb') as forms_zip:
                      import_form(forms_zip)
              Form.objects.filter(slug=FORM_SLUG).update(active=True)
              "
          securityContext:
            {{- include "zac-dev.nonRootContainerSecurityContext" . | nindent 12 }}
            runAsUser: 1000
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: configuration
              mountPath: /seed/configuration
            - name: forms
              mountPath: /seed/forms
            - name: settings
              mountPath: /app/src/openforms/conf/docker_local.py
              subPath: docker_local.py
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: configuration
          configMap:
            name: openformulieren-setup-configuration
        - name: forms
          configMap:
            name: seed-openformulieren-forms
        - name: settings
          configMap:
            name: openformulieren-settings
        - name: tmp
          emptyDir: {}
{{- end }}
