{{- /*
  A NodePort per entry of scripts/kind/ports.json, which the port proxy container of scripts/kind/up.sh publishes
  on the host.
*/}}
{{- range $port := .Values.ports }}
---
apiVersion: v1
kind: Service
metadata:
  name: nodeport-{{ $port.name }}
  namespace: {{ $.Release.Namespace }}
spec:
  type: NodePort
  selector:
    {{- toYaml $port.selector | nindent 4 }}
  ports:
    - port: {{ $port.targetPort }}
      targetPort: {{ $port.targetPort }}
      nodePort: {{ $port.nodePort }}
{{- end }}
{{- /*
  Docker Compose host names in the ZAC settings and test data (http://openzaak.local:8000 and so on). A host name
  with a dot cannot be a Service name, so CoreDNS rewrites each of them to one of these Services (see
  scripts/kind/up.sh), which listen on the Docker Compose port. bag-wiremock.local is rewritten to bag-wiremock.
*/}}
{{- range $alias := list
  (dict "name" "openzaak-local" "selector" "openzaak-nginx" "port" 8000 "targetPort" 8080)
  (dict "name" "open-object-local" "selector" "openobject" "port" 8000 "targetPort" 8000)
  (dict "name" "openklant-local" "selector" "openklant" "port" 8000 "targetPort" 8000) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $alias.name }}
  namespace: {{ $.Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: {{ $alias.selector }}
  ports:
    - port: {{ $alias.port }}
      targetPort: {{ $alias.targetPort }}
{{- end }}
