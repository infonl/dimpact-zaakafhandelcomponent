{{- if .Values.profiles.metrics }}
{{- /*
  Tempo for the traces, Prometheus for the metrics and Grafana to show both. ZAC in the cluster sends its traces
  through the OpenTelemetry collector of the ZAC Helm chart; a ZAC in an IDE through the collector below.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics
  namespace: {{ .Release.Namespace }}
data:
  otel-collector.yaml: |
    {{- .Files.Get "files/metrics/otel-collector.yaml" | nindent 4 }}
  tempo.yaml: |
    {{- .Files.Get "files/metrics/tempo.yaml" | nindent 4 }}
  prometheus.yaml: |
    {{- tpl (.Files.Get "files/metrics/prometheus.yaml") . | nindent 4 }}
  grafana-datasources.yaml: |
    {{- .Files.Get "files/metrics/grafana-datasources.yaml" | nindent 4 }}
{{- range $workload := list
  (dict "name" "tempo" "image" $.Values.tempo.image "user" 10001 "args" (list "-config.file=/etc/metrics/tempo.yaml")
    "port" 3200 "ports" (list 3200 4317) "data" "/var/tempo")
  (dict "name" "prometheus" "image" $.Values.prometheus.image "user" 65534
    "args" (list "--config.file=/etc/metrics/prometheus.yaml" "--storage.tsdb.path=/prometheus" "--web.enable-remote-write-receiver" "--enable-feature=exemplar-storage")
    "port" 9090 "ports" (list 9090) "data" "/prometheus")
  (dict "name" "grafana" "image" $.Values.grafana.image "user" 472 "args" (list)
    "port" 3000 "ports" (list 3000) "data" "/var/lib/grafana") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $workload.name }}
  namespace: {{ $.Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ $workload.name }}
  template:
    metadata:
      labels:
        app: {{ $workload.name }}
      annotations:
        checksum/configuration: {{ tpl ($.Files.Glob "files/metrics/*").AsConfig $ | sha256sum }}
    spec:
      enableServiceLinks: false
      securityContext:
        {{- include "zac-dev.podSecurityContext" $ | nindent 8 }}
        runAsUser: {{ $workload.user }}
        runAsGroup: {{ $workload.user }}
        fsGroup: {{ $workload.user }}
      containers:
        - name: {{ $workload.name }}
          image: {{ $workload.image }}
          {{- with $workload.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if eq $workload.name "grafana" }}
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Admin
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            - name: GF_FEATURE_TOGGLES_ENABLE
              value: traceqlEditor
          {{- end }}
          ports:
            {{- range $workload.ports }}
            - containerPort: {{ . }}
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: {{ $workload.port }}
            periodSeconds: 3
          securityContext:
            {{- include "zac-dev.nonRootContainerSecurityContext" $ | nindent 12 }}
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: {{ $workload.data }}
            {{- if eq $workload.name "grafana" }}
            - name: configuration
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: grafana-datasources.yaml
            {{- else }}
            - name: configuration
              mountPath: /etc/metrics
            {{- end }}
      volumes:
        - name: data
          {{- if eq $workload.name "grafana" }}
          persistentVolumeClaim:
            claimName: grafana-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: configuration
          configMap:
            name: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $workload.name }}
  namespace: {{ $.Release.Namespace }}
spec:
  selector:
    app: {{ $workload.name }}
  ports:
    {{- range $workload.ports }}
    - name: port-{{ . }}
      port: {{ . }}
      targetPort: {{ . }}
    {{- end }}
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storageClassName }}
  resources:
    requests:
      storage: 1Gi
{{- if .Values.zacOutsideCluster }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
      annotations:
        checksum/configuration: {{ .Files.Get "files/metrics/otel-collector.yaml" | sha256sum }}
    spec:
      enableServiceLinks: false
      securityContext:
        {{- include "zac-dev.podSecurityContext" . | nindent 8 }}
      containers:
        - name: otel-collector
          image: {{ .Values.otelCollector.image }}
          args: ["--config=/etc/metrics/otel-collector.yaml"]
          ports:
            - containerPort: 4317
          readinessProbe:
            tcpSocket:
              port: 4317
            periodSeconds: 3
          securityContext:
            {{- include "zac-dev.nonRootContainerSecurityContext" . | nindent 12 }}
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: configuration
              mountPath: /etc/metrics
      volumes:
        - name: configuration
          configMap:
            name: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: otel-collector
  ports:
    - port: 4317
      targetPort: 4317
{{- else }}
---
apiVersion: v1
kind: Service
metadata:
  name: zac-management
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: zaakafhandelcomponent
    app.kubernetes.io/instance: zac
  ports:
    - port: 9990
      targetPort: 9990
{{- end }}
{{- end }}
