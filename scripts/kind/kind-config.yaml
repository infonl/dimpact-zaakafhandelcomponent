#
# The kind cluster of the local ZAC development stack. It maps no host ports: a separate port proxy container
# publishes the NodePorts (see scripts/kind/up.sh), so that the host ports can change without a new cluster.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        # the kubelet pulls one image at a time and at most 5 per second by default, which delays the cold pulls of
        # the stack with back-offs
        serializeImagePulls: false
        registryPullQPS: 50
        registryBurst: 100
        # 'kubectl logs' only returns the current log file of a container, and the integration tests read the
        # whole log of ZAC
        containerLogMaxSize: 500Mi
