#
# SPIKE (PZ-13059): arm64 (Apple Silicon) builds of the images that upstream only publishes for amd64, the same
# ghcr.io/infonl images as docker-compose.arm64-override.yaml. A kind node on Docker Desktop can run the
# single-manifest amd64 images (Open Zaak, Open Object, Open Klant) through Rosetta, but not PABC: its image
# is a manifest list with only an amd64 entry, which containerd refuses on an arm64 node.
openzaak:
  image:
    repository: ghcr.io/infonl/open-zaak
    tag: "1.31.0@sha256:0c80c1139f8d5d9c500ad7ecd34b0dcfc886fd9b9fc467af918863c8eec568aa"
objecten:
  image:
    repository: ghcr.io/infonl/open-object
    tag: "4.1.1@sha256:8bda80d7de276ddd381ff45ac2c5e0b52b43787bf4c02f42d1b069b5e823ebdf"
openklant:
  image:
    repository: ghcr.io/infonl/open-klant
    tag: "2.15.0@sha256:090741b0c2211588e882dad93741e1bb6c13ce9d95ae13d1cd2ab591339b6a36"
pabc:
  image:
    repository: ghcr.io/infonl/pabc-api
    tag: "2.1.0@sha256:34662191126bc2e90838287114de558b4a249485d4a212fae51e06bdff69b288"
  migrations:
    image:
      repository: ghcr.io/infonl/pabc-migrations
      tag: "2.1.0@sha256:664f0fae4b0f3b70f685cc7af6a639b3c893b5ba597a0055665143d9d180288a"
