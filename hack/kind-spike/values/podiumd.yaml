# SPIKE (PZ-13059): values for the PodiumD umbrella chart (release 'podiumd', namespace 'podiumd') with only
# the components that the ZAC integration tests need. ZAC itself is installed from charts/zac as a separate
# release. In the agreed design these values are split over a dimpact-provisioning 'ci'/'local' layer and the
# ZAC repo; for the spike they live in one file.

global:
  configuration:
    # no django-setup-configuration jobs: the ZAC test data is restored from SQL dumps and fixtures
    enabled: false
  settings:
    # one Postgres server for every component, from charts/zac-dev (part=infra)
    databaseHost: postgres.podiumd.svc.cluster.local

# components that ZAC does not need
zac: {enabled: false}
kiss: {enabled: false}
kiss-eck: {enabled: false}
eck-operator: {enabled: false}
ita: {enabled: false}
zgw-office-addin: {enabled: false}
clamav: {enabled: false}
openformulieren: {enabled: false}
openinwoner: {enabled: false}
opennotificaties: {enabled: false}
# Open Object 4 (see objecten.image) serves the objecttypen itself
objecttypen: {enabled: false}

brppersonenmock:
  enabled: true

keycloak:
  auth:
    adminPassword: admin
  instances: "1"
  hostname:
    # Tokens carry this issuer for the itests on the host and for ZAC in the cluster alike. ZAC reaches
    # Keycloak in the cluster; hostname-backchannel-dynamic (below) gives it in-cluster token/JWKS URLs.
    hostname: http://localhost:28081
    admin: http://localhost:28081
  additionalOptions:
    - name: health-enabled
      value: "true"
    - name: metrics-enabled
      value: "true"
    - name: cache
      value: "ispn"
    - name: cache-stack
      value: ""
    - name: hostname-backchannel-dynamic
      value: "true"
  config:
    adminFrontendUrl: http://localhost:28081
    realmFrontendUrl: ""
    # the itests reuse a user's token for longer than the PodiumD default of 60 seconds
    accessTokenLifespan: 300
    smtp:
      server: greenmail.zac.svc.cluster.local
      port: "25"
      starttls: "false"
    clients:
      monitoring: {enabled: false}
      datamigratie: {enabled: false}
      zaakbrug: {enabled: false}
  externalDatabase:
    host: postgres.podiumd.svc.cluster.local
    port: 5432
    database: keycloak
    user: keycloak
    password: keycloak
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1536Mi

keycloak-operator:
  jobs:
    ensureOperatorSa:
      clientSecret: fakeKeycloakOperatorSecret

redis-operator:
  redis-ha:
    replicaCount: 1
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
    resources:
      requests:
        cpu: 10m
        memory: 32Mi

# The values below mirror the Docker Compose itest stack, which the itest test data was made for.
zac:
  enabled: false
  contextUrl: http://localhost:8080
  auth:
    clientId: zac
    secret: keycloakZaakafhandelcomponentClientSecret
  keycloak:
    adminClient:
      id: zaakafhandelcomponent-admin-client
      secret: zaakafhandelcomponentAdminClientSecret

openzaak:
  # ahead of PodiumD 4.9.4 (1.29.3): the Open Zaak test data dump was made with 1.31.0
  image:
    repository: openzaak/open-zaak
    tag: "1.31.0@sha256:d25566131129d5013ea936a2b25ea40e567fd3aa38120335aa552ba54e76300c"
  replicaCount: 1
  configuration:
    enabled: false
    oidcUrl: http://localhost:28001
  create_required_catalogi_job:
    enabled: false
  settings:
    allowedHosts: openzaak.local,localhost,openzaak-nginx.podiumd.svc.cluster.local
    database:
      name: openzaak
      username: openzaak
      password: openzaak
    secretKey: openZaakSecretKey
    isHttps: false
    disable2fa: true
    notificationsDisabled: true
    email:
      useTLS: false
  persistence:
    # pre-created by up.sh on the kind 'standard' StorageClass, see the PodiumD storage workaround
    existingClaim: openzaak
    storageClassName: standard
  worker:
    replicaCount: 0
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

objecten:
  # Open Object 4.1.1 (objecten + objecttypen in one), as in Docker Compose; PodiumD 4.10 moves to it
  image:
    repository: maykinmedia/open-object
    tag: "4.1.1@sha256:593571842b4af655383964fb3fa869b62313e7cd1e56a02f173afa8e4713c4b6"
  replicaCount: 1
  configuration:
    enabled: false
    oidcUrl: http://localhost:28010
  settings:
    allowedHosts: open-object.local,localhost
    siteDomain: open-object.local:8000
    database:
      name: objects
      username: objects
      password: objects
    secretKey: objectenApiSecretKey
    isHttps: false
    disable2fa: true
  persistence:
    existingClaim: objecten
    storageClassName: standard
  worker:
    replicaCount: 0
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

openklant:
  replicaCount: 1
  configuration:
    enabled: false
    oidcUrl: http://localhost:28002
  settings:
    allowedHosts: openklant.local,localhost
    database:
      name: openklant
      username: openklant
      password: openklant
    secretKey: openKlantSecretKey
    isHttps: false
    disable2fa: true
    notificationsDisabled: true
  persistence:
    existingClaim: openklant
    storageClassName: standard
  worker:
    replicaCount: 0
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

pabc:
  # ahead of PodiumD 4.9.4 (1.1.1), as in Docker Compose; PodiumD 4.10 moves to 2.1.0
  image:
    tag: "2.1.0@sha256:7e4f906ea46ba4eace1997a074099a5a54038e38901890d486d117583861a61d"
  migrations:
    image:
      tag: "2.1.0@sha256:75640f1ee9dc6a155800a31457574b9c36eb0cd41827c45333b9f39d05c94abb"
    dataSetPath: /app/json/pabc-mapping-data.json
    extraVolumes:
      - name: dataset
        configMap:
          name: seed-pabc-dataset
    extraVolumeMounts:
      - name: dataset
        mountPath: /app/json
  settings:
    database:
      host: postgres.podiumd.svc.cluster.local
      name: Pabc
      username: pabc
      password: pabc
    apiKeys: ["zac-test-api-key"]
    oidc:
      authority: http://keycloak-service.podiumd.svc.cluster.local:8080/realms/podiumd/
      clientSecret: pabcClientSecret
      requireHttps: false
      oidcUrl: http://localhost:28006
    keycloakAdmin:
      clientSecret: pabcAdminClientSecret
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
